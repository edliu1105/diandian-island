<link rel="apple-touch-startup-image" media="(device-width: 744px) and (device-height: 1133px) and (orientation: landscape)" href="assets/splash/splash-2266x1488.png">
<style>
/* ============================================================
   点点岛 · one visual language
   ink #2B2118 · paper #FFF8EC · 3 radii · 1 sticker shadow · 3 easings
   ============================================================ */
:root{
  --ink:#2B2118; --paper:#FFF8EC; --cream:#FFF4D6;
  --sun:#FFC93C; --coral:#FF6B5B; --sky:#4FB3FF; --grass:#5CC46E; --grape:#8E6CFF; --orange:#FF9F43; --pink:#FF7FA8; --teal:#27C3C8;
  --world:#FFC93C; --world2:#FF9F43;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --stk: 0 0 0 4px var(--ink), 0 7px 0 4px rgba(43,33,24,.22), 0 14px 26px 4px rgba(43,33,24,.18);
  --stk-sm: 0 0 0 3px var(--ink), 0 5px 0 3px rgba(43,33,24,.22), 0 10px 18px 3px rgba(43,33,24,.16);
  --pop: cubic-bezier(.2,.9,.3,1.25);
  --glide: cubic-bezier(.45,0,.2,1);
  --drop: cubic-bezier(.5,0,.9,.4);
  --st: env(safe-area-inset-top,0px); --sr: env(safe-area-inset-right,0px);
  --sb: env(safe-area-inset-bottom,0px); --sl: env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
body{position:fixed;inset:0}
img{-webkit-user-drag:none;user-select:none;pointer-events:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{display:none}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.fade-in{animation:fadeIn .32s var(--glide) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gone{display:none!important}

/* ---------- sticker buttons ---------- */
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:#fff;border:3px solid #fff;box-shadow:var(--stk);transition:transform .12s var(--pop),filter .12s;touch-action:none}
.btn.press,.tgt.press{transform:scale(.9);filter:brightness(1.06)}
.btn svg{width:62%;height:62%;overflow:visible}
.tgt{touch-action:none}
.tgt::before{content:"";position:absolute;inset:calc(-1 * var(--hy, 10px)) -10px}
.actor.tgt::before{inset:-10px calc(-1 * var(--hx, 10px))}

/* ---------- entry ---------- */
#entry{background:radial-gradient(120% 90% at 50% 18%,#FFFDF5 0%,#FFF4D6 55%,#FFE7B5 100%)}
#entry .sea{position:absolute;left:-5%;right:-5%;bottom:-2%;height:26%;background:#4EC6F0;border-radius:50% 50% 0 0/28% 28% 0 0;
  box-shadow:inset 0 10px 0 rgba(255,255,255,.45)}
#entry .sea::after{content:"";position:absolute;left:0;right:0;top:18%;height:10px;background:repeating-radial-gradient(circle at 20px 0,rgba(255,255,255,.7) 0 6px,transparent 7px 40px);opacity:.6;animation:drift 6s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:80px 0}}
#entry .logo{position:absolute;left:50%;top:7%;width:min(34vmin,290px);transform:translateX(-50%)}
#entry .logo img{width:100%;border-radius:23%;box-shadow:0 0 0 5px var(--ink),0 10px 0 5px rgba(43,33,24,.2),0 26px 40px rgba(43,33,24,.22);animation:bob 3.2s ease-in-out infinite}
#entry .word{position:absolute;left:50%;top:calc(7% + min(34vmin,290px) + 18px);transform:translateX(-50%)}
#entry .word svg{height:min(11vmin,84px);width:auto;overflow:visible;display:block}
#play{left:50%;bottom:calc(9% + var(--sb));width:min(20vmin,150px);height:min(20vmin,150px);transform:translateX(-50%);background:var(--grass);animation:breatheBtn 1.6s ease-in-out infinite}
#play.press{transform:translateX(-50%) scale(.9)}
#play svg{width:46%;height:46%;margin-left:8%}
@keyframes breatheBtn{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 22px rgba(92,196,110,.22)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#entry .chars{position:absolute;left:0;right:0;bottom:calc(17% + var(--sb));height:0}
#entry .chars img{position:absolute;bottom:0;height:min(17vmin,150px);filter:drop-shadow(0 6px 0 rgba(43,33,24,.12))}

/* ---------- map ---------- */
#map{background:#34C0EE}
#mapbg{position:absolute;inset:0;background-size:cover;background-position:center}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl{position:absolute;width:0;height:0}
.isl .hit{position:absolute;border-radius:50%;touch-action:none}
.isl .land{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:filter .6s}
.isl.locked .land{filter:saturate(.35) brightness(.96)}
.isl .hero{position:absolute;transform-origin:50% 100%}
.isl .cloudcover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .8s,transform .8s}
.isl:not(.locked) .cloudcover{opacity:0;transform:translate(-50%,-70%) scale(1.3)}
.lantern{position:absolute;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 9px;border-radius:16px;background:rgba(255,248,236,.94);
  box-shadow:var(--stk-sm);transform:translateX(-50%)}
.lantern i{display:block;width:20px;height:20px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 2px 0 rgba(43,33,24,.08)}
.lantern i.on{background:none;box-shadow:none}
.lantern i.on::after{content:"";display:block;width:100%;height:100%;background:url(assets/props/ui_star.png) center/contain no-repeat}
.bigstars{position:absolute;display:flex;gap:2px;transform:translateX(-50%)}
.isl .deco{position:absolute;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.isl .deco > div{height:100%;aspect-ratio:1/1;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.isl .deco .pen{aspect-ratio:2/3}
.bigstars img{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.flagpole{position:absolute;width:6px;height:70px;background:var(--ink);border-radius:3px;transform-origin:50% 100%}
.flagpole::after{content:"";position:absolute;left:5px;top:2px;width:46px;height:30px;background:var(--world);border:3px solid var(--ink);border-radius:4px 14px 14px 4px;animation:flag 1.8s ease-in-out infinite;transform-origin:0 50%}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg) scaleX(.94)}}
#gear{right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));width:88px;height:88px;background:transparent;border:0;box-shadow:none;border-radius:50%}
#gear .g{position:absolute;inset:26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(43,33,24,.35)}
#gear svg{position:absolute;inset:30px;width:28px;height:28px;opacity:.6}
#gear .ring{position:absolute;inset:18px;width:52px;height:52px;transform:rotate(-90deg)}
#nosound{position:fixed;left:50%;top:calc(14px + var(--st));width:104px;height:104px;margin-left:-52px;background:#FFE08A;z-index:45;display:none;animation:breatheBtn 1.6s ease-in-out 4}
#nosound svg{width:66%;height:66%}
html.nosound body[data-scr="map"] #nosound{display:flex}
/* no sound: only the big speaker calls (four pulses); the avatar stays still - one thing at a time */
html.nosound #avatar .ear{background:#FFE08A;width:52px;height:52px;right:-10px;bottom:-10px}
#toast{position:absolute;right:calc(20px + var(--sr));bottom:calc(110px + var(--sb));padding:12px 18px;border-radius:var(--r-md);background:#fff;box-shadow:var(--stk-sm);font-size:16px;font-weight:700;display:none}
#toast.on{display:block;animation:fadeIn .2s both}

/* ---------- loading ---------- */
#load{background:var(--world)}
#load::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.5),transparent 60%)}
#load .track{position:absolute;left:0;right:0;top:58%;height:14px;background:rgba(43,33,24,.12);border-radius:7px}
#load .runner{position:absolute;top:58%;height:min(30vmin,240px);transform:translate(-50%,-100%)}
#load .runner img{height:100%;animation:runHop .36s ease-in-out infinite alternate}
@keyframes runHop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
#load .dust{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.8)}

/* ---------- game ---------- */
#game{background:#222}
#gbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s;filter:saturate(.84) contrast(.94) brightness(1.03)}
#gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,255,255,0) 52%,rgba(40,26,12,.18) 100%);pointer-events:none}
/* one material per world: the task card and the answer cards wear the world's colours (the math stays the brightest thing) */
#game.w-peppa{--mat1:#FFF6F9;--mat2:#FFE2ED;--rim:#FF8DB3;--card:#FFFCFD;--cardrim:#FFD0E1}
#game.w-bluey{--mat1:#F0F9FF;--mat2:#D6ECFF;--rim:#6BB9F2;--card:#FBFDFF;--cardrim:#CBE6FB}
#game.w-huluwa{--mat1:#FCF6E2;--mat2:#EFDFAE;--rim:#6FA548;--card:#FFFDF6;--cardrim:#DCEBC8}
#game.w-paw{--mat1:#EEF4FF;--mat2:#D3E1FF;--rim:#E8554A;--card:#FBFCFF;--cardrim:#CFDDFA}
#game.w-xiyou{--mat1:#FFF8E6;--mat2:#FBE5B4;--rim:#D63B2F;--card:#FFFDF6;--cardrim:#F6DDA2}
#game.w-avengers{--mat1:#EEF7FF;--mat2:#CFE5FF;--rim:#3A5CC0;--card:#FAFCFF;--cardrim:#BFE8FF}
#gbg.blur{filter:blur(14px)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage > *{position:absolute}
/* one depth order on the stage: the scene <= 30 (ground furniture low; characters and things - the nearer in front) <
   cards, task card, done button 40 < a thing under the finger 45 < notes - numbers, rings, flags, badges, pairing
   lines, marks 50 (never covered) < the ghost hand 60 */
#stage > .card, #stage > .task, #stage > .done{z-index:40}
#stage > .badge, #stage > .ringo, #stage > .flagb, #stage > .note, #stage > svg.lines:not(.scene){z-index:50 !important}
.hud{position:absolute;z-index:40}
#home{left:calc(14px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;background:#FFE08A}
#home img{width:74%;height:74%;object-fit:contain}
#avatar{left:calc(134px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;overflow:hidden;background:var(--world)}
#avatar img{width:100%;height:100%;object-fit:cover}
#avatar .ear{position:absolute;right:-6px;bottom:-6px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
#avatar .ear svg{width:26px;height:26px}
#tray{right:calc(14px + var(--sr));top:calc(18px + var(--st));display:flex;gap:6px;padding:10px 12px;border-radius:24px;background:rgba(255,248,236,.95);box-shadow:var(--stk-sm)}
#tray i{width:40px;height:40px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 3px 0 rgba(43,33,24,.08);position:relative}
#tray i.on{background:none;box-shadow:none}
#tray i.on::after{content:"";position:absolute;inset:-3px;background:url(assets/props/ui_star.png) center/contain no-repeat}
#ff{position:absolute;inset:0;z-index:35;display:none}
#ff.on{display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx > *{position:absolute}

/* banner */
.banner{left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:min(26vmin,220px);line-height:1;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 rgba(43,33,24,.25);white-space:nowrap}
.banner span{display:inline-block}

/* actors */
.actor{transform-origin:50% 100%;will-change:transform}
.actor > .body{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.actor img.spr{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 0 rgba(43,33,24,.13))}
.actor .lid{position:absolute;border-radius:50%;transform:scaleY(0);transform-origin:50% 0;opacity:0}
.actor .lid::after{content:"";position:absolute;left:8%;right:8%;top:38%;height:30%;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.actor.blink .lid{animation:blink .16s ease-in-out}
@keyframes blink{0%{transform:scaleY(0);opacity:1}45%,60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
.actor .hat{position:absolute;pointer-events:none}
.actor .bubble{position:absolute;left:50%;top:-8%;transform:translate(-50%,-100%);width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
.actor .shadow{position:absolute;left:18%;right:18%;bottom:-2%;height:7%;border-radius:50%;background:rgba(43,33,24,.14);z-index:-1}

/* math representations */
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card,#fff);border-radius:var(--r-lg);border:4px solid var(--cardrim,#fff);box-shadow:var(--stk);touch-action:none;transition:transform .14s var(--pop),filter .14s}
.card.press{transform:scale(.92)}
.card .d{display:block;flex-shrink:0}
.card.hi{filter:drop-shadow(0 0 18px rgba(255,201,60,.95))}
.card.dim{opacity:.35}
.badge{width:48px;height:48px;border-radius:50%;background:var(--sun);box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center;pointer-events:none}
.badge svg{overflow:visible}
.flagb{pointer-events:none}
.task{left:50%;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:var(--r-lg);background:linear-gradient(var(--mat1,#FFF8EC),var(--mat2,#FFF1D6));box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--rim,#FFC93C),0 7px 0 7px rgba(43,33,24,.18);transform:translateX(-50%);pointer-events:none}
.task .it{display:flex;align-items:center;justify-content:center;gap:4px}
.task img{height:54px;width:auto}
.task .arw{width:34px;height:34px}
.task .goal .tap{animation:goalTap 1.2s ease-in-out 3;transform-box:fill-box;transform-origin:50% 0}
@keyframes goalTap{0%,55%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-6px) scale(1)}85%{transform:translateY(2px) scale(.9)}}
.task .qboth{display:flex;align-items:center;gap:6px}
.task .linkpic{display:flex;gap:6px}
.task .linkpic .lk{display:flex;flex-direction:column;align-items:center}
.task .linkpic img{height:30px;width:auto}
.task .qdots{position:relative;display:flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;perspective:200px}
.task .qflap{position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;background:#FFE08A;border-radius:12px;box-shadow:0 0 0 3px var(--ink);transform-origin:50% 0}
.task .qflap svg{width:38px;height:38px}
.done{border-radius:50%;background:var(--grass);border:3px solid #fff;box-shadow:var(--stk);display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .12s var(--pop)}
.done.press{transform:scale(.9)}
.done svg{width:58%;height:58%;overflow:visible}
.done .ring{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.done.ready{animation:readyPulse 1.2s ease-in-out 2.4s 2}   /* "done?" only after a pause, twice (single focus) */
@keyframes readyPulse{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 18px rgba(255,255,255,.55)}}
.glow{filter:drop-shadow(0 0 14px rgba(255,236,140,1)) drop-shadow(0 0 4px rgba(255,255,255,1))}
.yellowflash{animation:yflash .5s ease-in-out 3}
@keyframes yflash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 16px #FFD93C) brightness(1.15)}}
.wiggle{animation:wig .42s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.item{touch-action:none;transform-origin:50% 60%}
.item:not(.tgt){pointer-events:none}   /* a picture that is not a target never swallows a tap meant for what lies under it */
.item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(43,33,24,.14))}
.hand{width:96px;height:96px;z-index:60;pointer-events:none;transform-origin:30% 10%}
.spark{width:14px;height:14px;border-radius:50%}
svg.lines{left:0;top:0;overflow:visible;pointer-events:none}
.ringo{border:5px dashed var(--ink);border-radius:999px;pointer-events:none}

/* ---------- parent ---------- */
#parent{background:rgba(43,33,24,.55);z-index:100}
#parent .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--stk);padding:22px 26px;font-size:16px;line-height:1.5}
#parent h2{margin:0 0 10px;font-size:22px}
#parent h3{margin:18px 0 8px;font-size:17px}
#parent table{border-collapse:collapse;width:100%;font-size:14px}
#parent td,#parent th{border-bottom:1px solid rgba(43,33,24,.12);padding:6px 4px;text-align:left}
#parent .pbtn{display:inline-flex;align-items:center;justify-content:center;min-width:88px;min-height:52px;padding:0 16px;margin:4px 6px 4px 0;border-radius:14px;background:#fff;box-shadow:var(--stk-sm);font-weight:700}
#parent .pbtn.warn{background:#FFE1DC}
#parent .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:16px}
#parent .opts button{height:96px;border-radius:18px;background:#fff;box-shadow:var(--stk-sm);font-size:30px;font-weight:800}
#parent select{font-size:15px;padding:8px;border-radius:10px;max-width:100%}
#parent .x{position:absolute;right:14px;top:14px;width:88px;height:52px}
#parent .q{font-size:34px;font-weight:800;margin-top:8px}
#parent .mut{color:rgba(43,33,24,.6);font-size:13px}

/* ---------- finale ---------- */
#finale{background:#0B1F5C}

/* bags: balanced sequences that defeat fixed-position / fixed-rank / fixed-meaning strategies */
function bagPick(G, name, items) {
  const b = G.bags[name] || (G.bags[name] = []);
  if (!b.length) b.push(...G.rng.shuffle(items));
  return b.shift();
}
/* three numeric options for answer cards; rank of the correct value balanced by the size bag */
/* The RANK of the correct value among the three (smallest / middle / largest) is dealt from a bag, restricted to the
   ranks this value allows inside [lo, hi]; a rank that does not fit stays in the bag for a later question. So "always
   the smallest / middle / largest card" is right about one time in three over any stretch - also at the range ends. */
function numOptions(G, n, lo, hi) {
  lo = lo == null ? 1 : lo; hi = hi == null ? 20 : hi;
  const ok = { min: n + 2 <= hi, mid: n - 1 >= lo && n + 1 <= hi, max: n - 2 >= lo };
  if (G.wantRank) {
    /* Session.genQ dealt this question's rank; if this answer cannot take it, the question is drawn again */
    let r = G.wantRank;
    if (!ok[r]) { G.rankMiss = true; const f = ['min', 'mid', 'max'].filter(x => ok[x]); r = f.length ? f[Math.floor(G.rng() * f.length)] : 'mid'; }
    const set = r === 'min' ? [n, n + 1, n + 2] : r === 'mid' ? [n - 1, n, n + 1] : [n - 2, n - 1, n];
    return placeOptions(G, set, n);
  }
  const b = G.bags.rank || (G.bags.rank = []);
  if (!b.length) b.push(...G.rng.shuffle(['min', 'mid', 'max']));
  let i = b.findIndex(r => ok[r]), r;
  if (i >= 0) { r = b[i]; b.splice(i, 1); }
  else {
    const fresh = G.rng.shuffle(['min', 'mid', 'max']), j = fresh.findIndex(x => ok[x]);
    r = j >= 0 ? fresh.splice(j, 1)[0] : 'mid';
    b.push(...fresh);
  }
  const set = r === 'min' ? [n, n + 1, n + 2] : r === 'mid' ? [n - 1, n, n + 1] : [n - 2, n - 1, n];
  return placeOptions(G, set, n);
}
/* positions balanced by the position bag */
function placeOptions(G, vals, correct) {
  const pos = bagPick(G, 'pos', [0, 1, 2]);
  const others = G.rng.shuffle(vals.filter(v => v !== correct));
  const out = [];
  let k = 0;
  for (let i = 0; i < vals.length; i++) out.push(i === pos ? correct : others[k++]);
  return out;
}

  newQ(G, opt) {

    if (!kind) kind = kinds.length > 1 ? bagPick(G, 'kind' + level, kinds) : kinds[0];
    const q = this.genQ(G, level, kind);

    const st = {
      gen: ++this.qn, id: 'q' + this.qn, G, game: g, q, kind, level, phase: 'setup',
      hinted: !!opt.guided || !!opt.demo, guided: !!opt.guided, demo: !!opt.demo, retest: !!opt.retest, probe: !!opt.probe,
      evidence: !opt.guided && !opt.demo, err: opt.err || 0, scope: new Scope(G.scope), els: [], map: {}, ops: 0, childOps: 0, assists: [],

  /* one question from the generator: never the previous one again, and the rank of its answer among the three options

  genQ(G, level, kind) {

    let q = null, keep = null, met = false;

  /* J01-b: a required kind of evidence that the child's current level never asks -> ask it once, at its own level */
  probeFor(G) {
    if (G.probed || G.round !== 1) return null;
    const g = G.game, gs = Mastery.gs(G.ws, G.id), lvKinds = g.kinds(G.level, G);

  async round(G) {

         and praise done). A question that breaks on the way ('error') or is left ('dead') records nothing. */
      this.ffOn(st);

  /* D04: the friends react to the child's answer together - everyone turns to where it happened, then a wave of cheers */
  cheer(G, st) {

  async demo(G) {

      for (let guard = 0; guard < 40; guard++) {
        while (this.alive(my) && !['act', 'ready', 'input'].includes(my.phase) && !my.submitted) await my.scope.wait(120);

/* ================================================================ HINTS
   one clock (Clock.t, paused in the background) and absolute deadlines from the child's last own action:
   5 s the host leans towards the child and says the question again (then the work glows) · 10 s the host waves,
   then the gesture · 15 s the host yawns, then the hand points · 20 s the helper does one step · then one every 1.6 s.
   One thing at a time: a cue first, its hint only after it and only if the child has not acted meanwhile.
   Before the first hint (the child is thinking) a friend now and then glances at the child - never the host.
   Every one of them marks the question as assisted (it can never count as mastery evidence). */
const Hints = {
  arm(st) { this.reset(st); st.hintTimer = st.scope.interval(() => this.tick(st), 100); },
  disarm(st) { if (st && st.hintTimer) { st.scope.clear(st.hintTimer); st.hintTimer = 0; } },
  reset(st) { st.idleFrom = Clock.t(); st.hintLv = 0; st.nextAuto = 0; st.autoDue = 0; },
  touch(st) { this.reset(st); },
  mark(st, why) { st.assists.push(why + (st.phase === 'act' ? '@act' : '')); st.assistT = st.assistT || []; st.assistT.push([why, Math.round(Clock.t())]); if (st.phase !== 'act' || st.actMath) st.hinted = true; },
  tick(st) {
    if (!Session.alive(st) || !['act', 'ready', 'input'].includes(st.phase) || (st.demo && !st.childTook)) return;
    const t = Clock.t();
    if (st.hintLv === 0 && (Voice.busy() || Hand.busy)) { st.idleFrom = t; return; }   /* the ladder starts after the question was said */
    if (Hand.busy) return;
    const idle = (t - st.idleFrom) / HS();
    if (st.hintLv < 1) {
      if (idle < 5000) { this.life(st, t, idle); return; }
      st.hintLv = 1; this.mark(st, 'hint1');
      const h = Session.host(st.G); if (h && !fast()) h.glance();
      Voice.say(st.prompt || st.game.intro, { tag: 'hint1' });
      this.retap();
      st.scope.timeout(() => { if (st.hintLv === 1) this.glow(st); }, 450 * HS());

    let parts = [];
    const cols = ['#FFC93C', '#FF6B5B', '#4FB3FF', '#5CC46E', '#8E6CFF', '#FF9F43', '#FF7FA8'];
    const boom = () => { const x = window.innerWidth * (0.15 + Math.random() * 0.7), y = window.innerHeight * (0.1 + Math.random() * 0.3), c = cols[Math.floor(Math.random() * cols.length)]; for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2, v = 2 + Math.random() * 2.5; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 60 + Math.random() * 20, c }); } Sfx.nz(0, 0.3, 900, 200, 0.8, 0.12, 'lowpass'); };
    let alive = true;
    sc.add(() => { alive = false; cx.clearRect(0, 0, cv.width, cv.height); });
    const tick = () => {
      if (!alive) return;
      cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      parts = parts.filter(p => p.l > 0);
      parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.l--; cx.globalAlpha = Math.max(0, p.l / 80); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 3.2, 0, 7); cx.fill(); });
      cx.globalAlpha = 1;

    };
    tick();
    sc.interval(boom, 700);
    boom();
  },

};

/* ================================================================ STORY (D05: coming back is worth it)
   3rd visit of a world: the host brings a present - a flower that is planted on the island (map)
   5th visit: the friends line up and welcome the child one by one - a second flower
   10th visit: the host gets a hat and keeps wearing it; the island flies a little pennant

const FLOWER_SVG = c => '<svg viewBox="0 0 60 60" width="100%" height="100%"><path d="M30 34V58" stroke="#3E8E3E" stroke-width="5" stroke-linecap="round"/><path d="M30 50C22 44 14 46 12 50C18 54 26 54 30 50Z" fill="#5CC46E" stroke="#2B2118" stroke-width="2.5"/><g stroke="#2B2118" stroke-width="3"><circle cx="30" cy="12" r="9" fill="' + c + '"/><circle cx="42" cy="21" r="9" fill="' + c + '"/><circle cx="38" cy="35" r="9" fill="' + c + '"/><circle cx="22" cy="35" r="9" fill="' + c + '"/><circle cx="18" cy="21" r="9" fill="' + c + '"/><circle cx="30" cy="24" r="7.5" fill="#FFC93C"/></g></svg>';

  chapter(v) { return v >= 10 ? 3 : v >= 5 ? 2 : v >= 3 ? 1 : 0; },

/* stack the two plates in the middle, line each plate's items up in a row, pair them one-to-one.
   returns the unpaired items (the "extra" that shows who has more) */
async function stackCompare(st, plateA, A, plateB, B, hide) {
  const L = K.L(), n = Math.max(A.length, B.length, 1);
  const pw = 300, ph = 190, cx = Stage.W / 2;
  const yA = L ? 140 : 250, yB = L ? 372 : 482;                   /* two plates, a clear gap between them */
  (hide || []).forEach(e => st.scope.anim(e, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 }));      /* out of the plates' way */
  const sz = n > 5 ? 36 : 46, gap = Math.min(50, (pw - 90) / Math.max(1, n - 1));
  const x0 = cx - (n - 1) * gap / 2;
  await Promise.all([K.flyTo(st, plateA, cx - pw / 2, yA, 420), K.flyTo(st, plateB, cx - pw / 2, yB, 420)]);
  [plateA, plateB].forEach(pl => { pl.style.width = pw + 'px'; pl.style.height = ph + 'px'; });
  await Promise.all(A.map((e, i) => { e.style.width = e.style.height = sz + 'px'; return K.flyTo(st, e, x0 + i * gap - sz / 2, yA + ph / 2 - sz / 2, 360); })
    .concat(B.map((e, i) => { e.style.width = e.style.height = sz + 'px'; return K.flyTo(st, e, x0 + i * gap - sz / 2, yB + ph / 2 - sz / 2, 360); })));
  const s = K.lines(st);
  for (let i = 0; i < Math.min(A.length, B.length); i++) {
    if (st.scope.dead) return [];
    K.link(st, s, { x: x0 + i * gap, y: yA + ph / 2 + sz / 2 + 2 }, { x: x0 + i * gap, y: yB + ph / 2 - sz / 2 - 2 }, '#2B2118');
    Sfx.count(i + 1); await st.scope.wait(120);
  }
  return A.length > B.length ? A.slice(B.length) : B.slice(A.length);
}
/* line two sets up in aligned rows and pair them one-to-one; returns the unpaired elements */
async function pairUp(st, A, B, rowA, rowB, x0, x1) {
  const n = Math.max(A.length, B.length), w = Math.min(96, (x1 - x0) / Math.max(1, n));
  const xs = i => x0 + (x1 - x0) / 2 - (n - 1) * w / 2 + i * w;
  await Promise.all(A.map((e, i) => K.flyTo(st, e, xs(i) - box(e).w / 2, rowA - box(e).h / 2, 420)).concat(B.map((e, i) => K.flyTo(st, e, xs(i) - box(e).w / 2, rowB - box(e).h / 2, 420))));
  const s = K.lines(st);
  for (let i = 0; i < Math.min(A.length, B.length); i++) { K.link(st, s, { x: xs(i), y: rowA + 24 }, { x: xs(i), y: rowB - 24 }, '#2B2118'); Sfx.count(i + 1); await st.scope.wait(110); }
  return A.length > B.length ? A.slice(B.length) : B.slice(A.length);
}

defGame({

  intro: '谁的多？比一比！', kind0: 'more', praise: ['比得真准！'],
  kinds(level) { return level === 1 ? ['more', 'more', 'same'] : ['more', 'less', 'same']; },
  gen(G, o) {

    svg('path', { d, fill: 'none', stroke: '#5DB84A', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);

      w.appendChild(digits() ? UI.num(q.n, 90, { fill: '#B78CFF' }) : UI.dots(q.n, 150, { layout: q.n <= 6 ? 'dice' : 'frame', color: '#B78CFF' }));
      st.src = [];
      const add = n => { const e = this.crystalBundle(n); e.style.position = 'absolute'; e.style.zIndex = 5; Stage.el.appendChild(e); st.els.push(e); const s = { id: 's' + st.src.length, el: e, in: false }; st.src.push(s); K.reg(st, s.id, e, { drag: true, drops: () => [{ id: 'bowl', rect: () => box(G.els.bowl) }] }); };
      for (let i = 0; i < q.supply.singles; i++) add(1);
      if (q.supply.ten) add(10);
      q.supply.bundles.forEach(add);
      this.arrange(st, true);
      st.src.forEach((s, i) => K.pop(st, s.el, 30 * i));
      K.reg(st, 'bowl', G.els.bowl, {});
      st.doneBtn = K.done(st, 'paw'); K.reg(st, 'done', st.doneBtn, {});
      K.task(st, [[{ node: (() => { const d = lockEl(); d.style.position = 'relative'; d.style.width = '70px'; d.style.height = '54px'; d._win.appendChild(digits() ? UI.num(q.n, 26, { plain: true, ink: '#FFFFFF' }) : UI.dots(q.n, 40, { layout: 'dice', min: 3 })); return d; })() }], ['assets/props/crystal.png'], ['paw']]);
      G.actors.widow.hop();
      K.say(st, '照着密码放！');
    } else {
      w.innerHTML = ICONS.q.replace('<svg', '<svg width="90" height="90"');
      st.quiver = el('div', '', Stage.el); st.quiver.style.position = 'absolute'; st.quiver.style.zIndex = 5; st.els.push(st.quiver);
      const s = svg('svg', { viewBox: '0 0 260 200', width: 270, height: 208 }, st.quiver);
      svg('rect', { x: 8, y: 92, width: 244, height: 104, rx: 20, fill: '#6A4BA8', stroke: '#2B2118', 'stroke-width': 5 }, s);
      const P = this.arrowPos(q.n);
      P.forEach(a => { svg('line', { x1: a.x, y1: a.top + 12, x2: a.x, y2: 140, stroke: '#2B2118', 'stroke-width': 4.5 }, s); svg('path', { d: 'M' + (a.x - 8) + ' ' + (a.top + 18) + ' L' + a.x + ' ' + a.top + ' L' + (a.x + 8) + ' ' + (a.top + 18) + ' Z', fill: '#FFC93C', stroke: '#2B2118', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, s); });
      if (q.n >= 10) { const t = P.slice(0, 10); svg('rect', { x: t[0].x - 10, y: 62, width: t[9].x - t[0].x + 20, height: 12, rx: 6, fill: '#FFD34D', stroke: '#2B2118', 'stroke-width': 3 }, s); }   /* the band: a ten */
      st.targets = q.opts.map((v, i) => { const t = targetEl(v); Stage.el.appendChild(t); st.els.push(t); K.reg(st, 'card' + i, t, {}); K.pop(st, t, 90 * i); return t; });
      st.cards = st.targets; st.opts = q.opts;
      this.placeTargets(st);
      K.task(st, [[{ node: (() => { const d = el('span'); d.innerHTML = '<svg viewBox="0 0 40 40" width="48" height="48"><rect x="6" y="14" width="28" height="22" rx="6" fill="#6A4BA8" stroke="#2B2118" stroke-width="3"/><path d="M12 16V4M20 16V4M28 16V4" stroke="#2B2118" stroke-width="3"/></svg>'; return d; })() }], [{ node: (() => { const s = svg('svg', { viewBox: '0 0 120 120', width: 54, height: 54 }); [56, 42, 28].forEach((r, i) => svg('circle', { cx: 60, cy: 60, r, fill: ['#FFFFFF', '#FF6B5B', '#FFFFFF'][i], stroke: '#2B2118', 'stroke-width': 5 }, s)); const d = el('span'); d.appendChild(s); return d; })() }, 'q']]);
      G.actors.hawkeye.hop();
      K.say(st, '射哪个靶？');
    }
  },
  count(st) { return st.src.filter(s => s.in).reduce((a, s) => a + s.el._val, 0); },
  onGesture(st, name, p) {
    const id = p.id || '';
    if (st.q.kind === 'q2n') { const i = K.cardIndex(id); if (name === 'tap' && i >= 0) { Session.submit(st, st.opts[i]); return 'ok'; } return false; }
    if (id === 'done' && name === 'tap') { Session.submit(st, this.count(st)); return 'ok'; }
    if (id === 'bowl' && name === 'tap') { const s = st.src.filter(x => x.in).pop(); if (!s) return false; s.in = false; Sfx.back(); this.arrange(st); return 'ok'; }
    if (/^s\d+$/.test(id) && (name === 'tap' || name === 'drop')) {
      const s = st.src.find(x => x.id === id); s.el.style.transform = '';
      if (name === 'drop' && s.in) return false;
      s.in = !s.in; Sfx.place(); this.arrange(st);
      if (s.in) { const w = st.G.actors[Math.random() < 0.5 ? 'spiderman' : 'miles']; w.hop(); }
      st.doneBtn.classList.add('ready');
      return 'ok';
    }
    return false;
  },
  async reveal(st) {
    const q = st.q, my = st, G = st.G;
    st.summary = CN[q.n] + '，就是' + CNQ(q.n) + '个！';
    const w = G.els.lock._win, lb = box(G.els.lock);
    if (q.kind === 'q2n') {
      const t = st.targets[st.opts.indexOf(q.n)], tb = box(t);
      Fx.arrow(Stage.toScreen(lb.x, tb.y + 60).x, Stage.toScreen(lb.x, tb.y + 60).y); Sfx.whoosh(0.3);
      await st.scope.wait(300);
      K.hop(st, t, 20); t.classList.add('glow');
      w.innerHTML = ''; w.appendChild(UI.qty(q.n, 90, { fill: '#B78CFF' }));
    }
    /* the numeral breaks into its dots, one for each crystal / arrow */
    const dots = UI.dotPos(Math.min(q.n, 10), q.n <= 6 ? 'dice' : 'frame').P;
    const sparks = [];
    for (let i = 0; i < q.n; i++) {
      const d = el('div', 'note', Stage.el); Object.assign(d.style, { position: 'absolute', width: '22px', height: '22px', borderRadius: '50%', background: '#FFE06A', boxShadow: '0 0 0 3px #2B2118, 0 0 14px #FFE06A' }); st.els.push(d);
      const [u, v] = dots[i % dots.length] || [0.5, 0.5]; place(d, lb.x + 60 + u * 140 + (i >= 10 ? 10 : 0), lb.y + 50 + v * 60 + (i >= 10 ? 30 : 0)); sparks.push(d);
    }
    Sfx.reveal();
    await st.scope.wait(300);
    if (!Session.alive(my)) return;
    if (q.kind === 'n2q') {
      const targets = [];
      st.src.filter(s => s.in).forEach(s => { const b = box(s.el); for (let k = 0; k < s.el._val; k++) targets.push({ x: b.x + 12 + (k % 5) * 20, y: b.y + 10 + Math.floor(k / 5) * 26 }); });
      await Promise.all(sparks.map((d, i) => targets[i] ? K.flyTo(st, d, targets[i].x, targets[i].y, 520, 40) : null));
      await st.scope.anim(G.els.lock, [{ transform: 'translateY(0)' }, { transform: 'translateY(-40px)' }, { transform: 'translateY(0)' }], { duration: 500, fill: 'none' });
    } else {
      const qb = box(st.quiver), P = this.arrowPos(q.n), k = 270 / 260;      /* each spark on its own arrow head */
      await Promise.all(sparks.map((d, i) => P[i] ? K.flyTo(st, d, qb.x + P[i].x * k - 11, qb.y + P[i].top * k - 4, 520, 40) : null));
    }
    G.actors.panther.react('pounce');
    Voice.say(st.summary, { tag: 'summary' });
    await st.scope.wait(900);
  },
  async feedback(st, ans) {
    if (st.q.kind === 'q2n') { const i = st.opts.indexOf(ans); if (st.targets[i]) K.wiggle(st, st.targets[i]); await st.scope.wait(350); return; }
    K.flash(st, [st.G.els.bowl]); await st.scope.wait(600);
  },
  async correct(st) {
    const q = st.q, my = st, G = st.G;
    const lb = box(G.els.lock);
    const helper = el('div', 'card', Stage.el); helper.style.position = 'absolute'; st.els.push(helper); helper.style.zIndex = 15;
    helper.appendChild(UI.num(q.n, 60)); helper.appendChild(UI.dots(q.n, 110, { layout: q.n <= 6 ? 'dice' : 'frame' }));
    place(helper, lb.x + lb.w + 20, lb.y, 160, 180); K.pop(st, helper);
    Voice.say(CN[q.n] + '有这么多', { tag: 'fix' });
    await Voice.afterSay(100);
    if (q.kind === 'n2q') {
      st.src.forEach(s => { s.in = false; }); await this.arrange(st);
      const order = st.src.slice().sort((a, b) => b.el._val - a.el._val);
      let left = q.n;
      for (const s of order) { if (!Session.alive(my)) return; if (s.el._val <= left) { s.in = true; left -= s.el._val; this.arrange(st); await Count.beat(st.scope, 450, q.n - left); } if (!left) break; }
    } else {
      st.targets[st.opts.indexOf(q.n)].classList.add('hi');
    }
    await Voice.say(CN[q.n] + '，就是' + CNQ(q.n) + '个', { tag: 'fix' });
  },
  next(st, strat) {
    const q = st.q;
    if (q.kind === 'q2n') return K.cardNext(st, strat);
    const bk = /^build:(\d+)$/.exec(strat || ''), K0 = bk ? Number(bk[1]) : null;
    const want = bk ? K0 : strat === 'wrong' ? q.n + 1 : q.n, have = this.count(st);
    if (have === want) return { g: 'tap', p: { id: 'done' } };
    if (have > want) return { g: 'tap', p: { id: 'bowl' } };
    const left = want - have;
    const cand = st.src.filter(s => !s.in && s.el._val <= left).sort((a, b) => b.el._val - a.el._val)[0];
    return cand ? { g: 'tap', p: { id: cand.id } } : { g: 'tap', p: { id: 'bowl' } };
  },
  workEls(st) { return st.targets || (st.src || []).map(s => s.el); },
  gestureHint(st) { if (st.q.kind !== 'n2q') return; const s = st.src.find(x => !x.in); if (!s) return; const a = center(s.el), b = center(st.G.els.bowl); Hand.busy++; Hand.drag(st.scope, a.x, a.y, b.x, b.y, 700).then(() => { Hand.done(); Hand.hide(st.scope); }); },
  snap(st) { return { opts: st.opts || null, count: st.src ? this.count(st) : null }; },
});

/*@@MORE@@*/
boot();</script>

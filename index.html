<style>
/* ============================================================
   点点岛 · one visual language
   ink #2B2118 · paper #FFF8EC · 3 radii · 1 sticker shadow · 3 easings
   ============================================================ */
:root{
  --ink:#2B2118; --paper:#FFF8EC; --cream:#FFF4D6;
  --sun:#FFC93C; --coral:#FF6B5B; --sky:#4FB3FF; --grass:#5CC46E; --grape:#8E6CFF; --orange:#FF9F43; --pink:#FF7FA8; --teal:#27C3C8;
  --world:#FFC93C; --world2:#FF9F43;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --stk: 0 0 0 4px var(--ink), 0 7px 0 4px rgba(43,33,24,.22), 0 14px 26px 4px rgba(43,33,24,.18);
  --stk-sm: 0 0 0 3px var(--ink), 0 5px 0 3px rgba(43,33,24,.22), 0 10px 18px 3px rgba(43,33,24,.16);
  --pop: cubic-bezier(.2,.9,.3,1.25);
  --glide: cubic-bezier(.45,0,.2,1);
  --drop: cubic-bezier(.5,0,.9,.4);
  --st: env(safe-area-inset-top,0px); --sr: env(safe-area-inset-right,0px);
  --sb: env(safe-area-inset-bottom,0px); --sl: env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
body{position:fixed;inset:0}
img{-webkit-user-drag:none;user-select:none;pointer-events:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{display:none}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.fade-in{animation:fadeIn .32s var(--glide) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gone{display:none!important}

/* ---------- sticker buttons ---------- */
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:#fff;border:3px solid #fff;box-shadow:var(--stk);transition:transform .12s var(--pop),filter .12s;touch-action:none}
.btn.press,.tgt.press{transform:scale(.9);filter:brightness(1.06)}
.btn svg{width:62%;height:62%;overflow:visible}
.tgt{touch-action:none}
.tgt::before{content:"";position:absolute;inset:calc(-1 * var(--hy, 10px)) -10px}
.actor.tgt::before{inset:-10px calc(-1 * var(--hx, 10px))}

/* ---------- entry ---------- */
#entry{background:radial-gradient(120% 90% at 50% 18%,#FFFDF5 0%,#FFF4D6 55%,#FFE7B5 100%)}
#entry .sea{position:absolute;left:-5%;right:-5%;bottom:-2%;height:26%;background:#4EC6F0;border-radius:50% 50% 0 0/28% 28% 0 0;
  box-shadow:inset 0 10px 0 rgba(255,255,255,.45)}
#entry .sea::after{content:"";position:absolute;left:0;right:0;top:18%;height:10px;background:repeating-radial-gradient(circle at 20px 0,rgba(255,255,255,.7) 0 6px,transparent 7px 40px);opacity:.6;animation:drift 6s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:80px 0}}
#entry .logo{position:absolute;left:50%;top:7%;width:min(34vmin,290px);transform:translateX(-50%)}
#entry .logo img{width:100%;border-radius:23%;box-shadow:0 0 0 5px var(--ink),0 10px 0 5px rgba(43,33,24,.2),0 26px 40px rgba(43,33,24,.22);animation:bob 3.2s ease-in-out infinite}
#entry .word{position:absolute;left:50%;top:calc(7% + min(34vmin,290px) + 18px);transform:translateX(-50%)}
#entry .word svg{height:min(11vmin,84px);width:auto;overflow:visible;display:block}
#play{left:50%;bottom:calc(9% + var(--sb));width:min(20vmin,150px);height:min(20vmin,150px);transform:translateX(-50%);background:var(--grass);animation:breatheBtn 1.6s ease-in-out infinite}
#play.press{transform:translateX(-50%) scale(.9)}
#play svg{width:46%;height:46%;margin-left:8%}
@keyframes breatheBtn{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 22px rgba(92,196,110,.22)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#entry .chars{position:absolute;left:0;right:0;bottom:calc(17% + var(--sb));height:0}
#entry .chars img{position:absolute;bottom:0;height:min(17vmin,150px);filter:drop-shadow(0 6px 0 rgba(43,33,24,.12))}

/* ---------- map ---------- */
#map{background:#34C0EE}
#mapbg{position:absolute;inset:0;background-size:cover;background-position:center}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl{position:absolute;width:0;height:0}
.isl .hit{position:absolute;border-radius:50%;touch-action:none}
.isl .land{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:filter .6s}
.isl.locked .land{filter:saturate(.35) brightness(.96)}
.isl.gate.locked .land{opacity:0}
.isl .hero{position:absolute;transform-origin:50% 100%}
.isl .cloudcover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .8s,transform .8s}
.isl:not(.locked) .cloudcover{opacity:0;transform:translate(-50%,-70%) scale(1.3)}
.lantern{position:absolute;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 9px;border-radius:16px;background:rgba(255,248,236,.94);
  box-shadow:var(--stk-sm);transform:translateX(-50%)}
.lantern i{display:block;width:20px;height:20px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 2px 0 rgba(43,33,24,.08)}
.lantern i.on{background:none;box-shadow:none}
.lantern i.on::after{content:"";display:block;width:100%;height:100%;background:url(assets/props/ui_star.png) center/contain no-repeat}
.bigstars{position:absolute;display:flex;gap:2px;transform:translateX(-50%)}
.isl .deco{position:absolute;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.isl .deco > div{height:100%;aspect-ratio:1/1;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.isl .deco .pen{aspect-ratio:2/3}
.bigstars img{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.flagpole{position:absolute;width:6px;height:70px;background:var(--ink);border-radius:3px;transform-origin:50% 100%}
.flagpole .cloth{position:absolute;left:4px;top:0;width:60px;height:42px;animation:flag 1.8s ease-in-out infinite;transform-origin:0 50%}
.flagpole .cloth svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flagpole .cloth img{position:absolute;left:15px;top:7px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--ink)}
.flagpole .finial{position:absolute;left:50%;top:-17px;width:24px;height:24px;transform:translateX(-50%)}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg) scaleX(.94)}}
#gear{right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));width:88px;height:88px;background:transparent;border:0;box-shadow:none;border-radius:50%}
#gear .g{position:absolute;inset:26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(43,33,24,.35)}
#gear svg{position:absolute;inset:30px;width:28px;height:28px;opacity:.6}
#gear .ring{position:absolute;inset:18px;width:52px;height:52px;transform:rotate(-90deg)}
#nosound{position:fixed;left:50%;top:calc(14px + var(--st));width:104px;height:104px;margin-left:-52px;background:#FFE08A;z-index:45;display:none;animation:breatheBtn 1.6s ease-in-out 4}
#nosound svg{width:66%;height:66%}
html.nosound body[data-scr="map"] #nosound{display:flex}
/* no sound: only the big speaker calls (four pulses); the avatar stays still - one thing at a time */
html.nosound #avatar .ear{background:#FFE08A;width:46px;height:46px;right:-18px;bottom:-15px}
#toast{position:absolute;right:calc(20px + var(--sr));bottom:calc(110px + var(--sb));padding:12px 18px;border-radius:var(--r-md);background:#fff;box-shadow:var(--stk-sm);font-size:16px;font-weight:700;display:none}
#toast.on{display:block;animation:fadeIn .2s both}

/* ---------- loading ---------- */
#load{background:var(--world)}
#load::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.5),transparent 60%)}
#load .track{position:absolute;left:0;right:0;top:58%;height:14px;background:rgba(43,33,24,.12);border-radius:7px}
#load .runner{position:absolute;top:58%;height:min(30vmin,240px);transform:translate(-50%,-100%)}
#load .runner img{height:100%;animation:runHop .36s ease-in-out infinite alternate}
@keyframes runHop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
#load .dust{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.8)}

/* ---------- game ---------- */
#game{background:#222}
#gbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s;filter:saturate(.84) contrast(.94) brightness(1.03)}
#gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,255,255,0) 52%,rgba(40,26,12,.18) 100%);pointer-events:none}
/* one material per world: the task card and the answer cards wear the world's colours (the math stays the brightest thing) */
#game.w-peppa{--mat1:#FFF6F9;--mat2:#FFE2ED;--rim:#FF8DB3;--card:#FFFCFD;--cardrim:#FFD0E1}
#game.w-bluey{--mat1:#F0F9FF;--mat2:#D6ECFF;--rim:#6BB9F2;--card:#FBFDFF;--cardrim:#CBE6FB}
#game.w-huluwa{--mat1:#FCF6E2;--mat2:#EFDFAE;--rim:#6FA548;--card:#FFFDF6;--cardrim:#DCEBC8}
#game.w-paw{--mat1:#EEF4FF;--mat2:#D3E1FF;--rim:#E8554A;--card:#FBFCFF;--cardrim:#CFDDFA}
#game.w-xiyou{--mat1:#FFF8E6;--mat2:#FBE5B4;--rim:#D63B2F;--card:#FFFDF6;--cardrim:#F6DDA2}
#game.w-avengers{--mat1:#EEF7FF;--mat2:#CFE5FF;--rim:#3A5CC0;--card:#FAFCFF;--cardrim:#BFE8FF}
#gbg.blur{filter:blur(14px)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage > *{position:absolute}
/* one depth order on the stage: the scene <= 30 (ground furniture low; characters and things - the nearer in front) <
   cards, task card, done button 40 < a thing under the finger 45 < notes - numbers, rings, flags, badges, pairing
   lines, marks 50 (never covered) < the ghost hand 60 */
#stage > .card, #stage > .task, #stage > .done{z-index:40}
#stage > .badge, #stage > .ringo, #stage > .flagb, #stage > .note, #stage > svg.lines:not(.scene){z-index:50 !important}
.hud{position:absolute;z-index:40}
#home{left:calc(14px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;background:#FFE08A}
#home img{width:74%;height:74%;object-fit:contain}
#avatar{left:calc(134px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;background:var(--world)}
/* the face fills the round picture (tools/make_thumbs.py puts it up-left of the middle); the speaker badge sits
   OUTSIDE at the lower right, so it never covers the face and is never cut by the circle */
#avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#avatar .ear{position:absolute;right:-13px;bottom:-11px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
#avatar .ear svg{width:23px;height:23px}
#tray{right:calc(14px + var(--sr));top:calc(18px + var(--st));display:flex;gap:6px;padding:10px 12px;border-radius:24px;background:rgba(255,248,236,.95);box-shadow:var(--stk-sm)}
#tray i{width:40px;height:40px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 3px 0 rgba(43,33,24,.08);position:relative}
#tray i.on{background:none;box-shadow:none}
#tray i.on::after{content:"";position:absolute;inset:-3px;background:url(assets/props/ui_star.png) center/contain no-repeat}
#ff{position:absolute;inset:0;z-index:35;display:none}
#ff.on{display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx > *{position:absolute}

/* banner */
.banner{left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:min(26vmin,220px);line-height:1;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 rgba(43,33,24,.25);white-space:nowrap}
.banner span{display:inline-block}

/* actors */
.actor{transform-origin:50% 100%;will-change:transform}
.actor > .body{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.actor img.spr{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 0 rgba(43,33,24,.13))}
.actor .lid{position:absolute;border-radius:50%;transform:scaleY(0);transform-origin:50% 0;opacity:0}
.actor .lid::after{content:"";position:absolute;left:8%;right:8%;top:38%;height:30%;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.actor.blink .lid{animation:blink .16s ease-in-out}
@keyframes blink{0%{transform:scaleY(0);opacity:1}45%,60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
.actor .hat{position:absolute;pointer-events:none}
.actor .bubble{position:absolute;left:50%;top:-8%;transform:translate(-50%,-100%);width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
.actor .shadow{position:absolute;left:18%;right:18%;bottom:-2%;height:7%;border-radius:50%;background:rgba(43,33,24,.14);z-index:-1}

/* math representations */
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card,#fff);border-radius:var(--r-lg);border:4px solid var(--cardrim,#fff);box-shadow:var(--stk);touch-action:none;transition:transform .14s var(--pop),filter .14s}
.card.press{transform:scale(.92)}
.card .d{display:block;flex-shrink:0}
.card.hi{filter:drop-shadow(0 0 18px rgba(255,201,60,.95))}
.card.dim{opacity:.35}
.badge{width:48px;height:48px;border-radius:50%;background:var(--sun);box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center;pointer-events:none}
.badge svg{overflow:visible}
.flagb{pointer-events:none}
.task{left:50%;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:var(--r-lg);background:linear-gradient(var(--mat1,#FFF8EC),var(--mat2,#FFF1D6));box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--rim,#FFC93C),0 7px 0 7px rgba(43,33,24,.18);transform:translateX(-50%);pointer-events:none}
.task .it{display:flex;align-items:center;justify-content:center;gap:4px}
.task img{height:54px;width:auto}
.task .arw{width:34px;height:34px}
.task .goal .tap{animation:goalTap 1.2s ease-in-out 3;transform-box:fill-box;transform-origin:50% 0}
@keyframes goalTap{0%,55%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-6px) scale(1)}85%{transform:translateY(2px) scale(.9)}}
.task .qboth{display:flex;align-items:center;gap:6px}
.task .linkpic{display:flex;gap:6px}
.task .linkpic .lk{display:flex;flex-direction:column;align-items:center}
.task .linkpic img{height:30px;width:auto}
.task .qdots{position:relative;display:flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;perspective:200px}
.task .qflap{position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;background:#FFE08A;border-radius:12px;box-shadow:0 0 0 3px var(--ink);transform-origin:50% 0}
.task .qflap svg{width:38px;height:38px}
.done{border-radius:50%;background:var(--grass);border:3px solid #fff;box-shadow:var(--stk);display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .12s var(--pop)}
.done.press{transform:scale(.9)}
.done svg{width:58%;height:58%;overflow:visible}
.done .ring{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.done.ready{animation:readyPulse 1.2s ease-in-out 2.4s 2}   /* "done?" only after a pause, twice (single focus) */
@keyframes readyPulse{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 18px rgba(255,255,255,.55)}}
.glow{filter:drop-shadow(0 0 14px rgba(255,236,140,1)) drop-shadow(0 0 4px rgba(255,255,255,1))}
.yellowflash{animation:yflash .5s ease-in-out 3}
@keyframes yflash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 16px #FFD93C) brightness(1.15)}}
.wiggle{animation:wig .42s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.item{touch-action:none;transform-origin:50% 60%}
.item:not(.tgt){pointer-events:none}   /* a picture that is not a target never swallows a tap meant for what lies under it */
.item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(43,33,24,.14))}
.hand{width:96px;height:96px;z-index:60;pointer-events:none;transform-origin:30% 10%}
.spark{width:14px;height:14px;border-radius:50%}
svg.lines{left:0;top:0;overflow:visible;pointer-events:none}
.ringo{border:5px dashed var(--ink);border-radius:999px;pointer-events:none}

/* ---------- parent ---------- */
#parent{background:rgba(43,33,24,.55);z-index:100}
#parent .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--stk);padding:22px 26px;font-size:16px;line-height:1.5}
#parent h2{margin:0 0 10px;font-size:22px}
#parent h3{margin:18px 0 8px;font-size:17px}
#parent table{border-collapse:collapse;width:100%;font-size:14px}
#parent td,#parent th{border-bottom:1px solid rgba(43,33,24,.12);padding:6px 4px;text-align:left}
#parent .pbtn{display:inline-flex;align-items:center;justify-content:center;min-width:88px;min-height:52px;padding:0 16px;margin:4px 6px 4px 0;border-radius:14px;background:#fff;box-shadow:var(--stk-sm);font-weight:700}
#parent .pbtn.warn{background:#FFE1DC}
#parent .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:16px}

    else if (!c && s && (s.speaking || s.pending)) this.cancelEngine(reason || 'hush');
    this.checkWaiters();
  },
  sayNow(text, opt) { this.hush('now'); return this.say(text, opt); },
  /* R4-I01: a newer number took the MP3 channel - an older synthesized number must not sound after it */
  dropTag(tag) {
    this.q = this.q.filter(d => { if (d.tag !== tag) return true; d.done = true; d.resolve('cancel'); return false; });
    const c = this.cur;
    if (c && c.tag === tag) { this.cur = null; this.localDoneAt = now(); c.finish && c.finish('cancel'); this.cancelEngine('count'); }
    this.checkWaiters();
  },
  /* the child taps the big "no sound" target: resume, and if the engine is idle speak synchronously in this gesture */
  retry(text) {
    const s = this.synth;
    Sfx.touch();
    text = text || this.lastText || '你好！';
    if (!s) { slog('narr', text, 'retry', 'nosynth'); return; }
    try { s.resume(); } catch (e) {}
    this.fails = Math.min(this.fails, 2);
    if (this.cur || s.speaking || s.pending || now() - this.lastCancelAt < 150) { this.sayNow(text, { tag: 'retry', owner: null }); return; }
    this.speakNow({ id: ++this.reqSeq, text, tag: 'retry', resolve: () => {}, done: false, owner: null });
  },
  schedulePump(ms) { if (this.pumpTimer) return; this.pumpTimer = setTimeout(() => { this.pumpTimer = 0; this.pump(); }, fast() ? 0 : ms); },
  pump() {
    if (this.cur) return;
    const stale = d => !ownerAlive(d.owner) || (d.ctx != null && d.ctx !== this.ctx.gen);
    while (this.q.length && stale(this.q[0])) { const d = this.q.shift(); d.done = true; d.resolve('stale'); slog('narr', d.text, d.tag, 'stale'); }   /* rule 8 at speak */
    if (!this.q.length) { this.checkWaiters(); return; }
    const gap = 150 - (now() - this.lastCancelAt);
    if (gap > 0) { this.schedulePump(gap + 5); return; }
    const head = this.q[0];
    if (Bank.has(head.text) && Sfx.ctx) {
      const b = Bank.ready(head.text);
      if (b && Sfx.ctx.state === 'running') { this.playClip(this.q.shift(), b); return; }
      if (!head.waitT) { head.waitT = now(); Bank.load(head.text).then(() => this.schedulePump(0)); }
      if (now() - head.waitT < (fast() ? 30 : 700)) { this.schedulePump(40); return; }
      /* not decoded / the audio not running in time: the speech engine says it */
    }
    const s = this.synth;
    if (!s) {                          /* no engine: keep the page rhythm without sound */
      const item = this.q.shift();
      this.cur = item; item.t0 = now();
      slog('narr', item.text, item.tag, 'nosynth');
      item.finish = (why) => { if (item.done) return; item.done = true; clearTimeout(item.to); if (this.cur === item) { this.cur = null; this.localDoneAt = now(); } item.resolve(why || 'nosynth'); this.schedulePump(90); this.checkWaiters(); };
      item.to = setTimeout(() => item.finish('nosynth'), fast() ? 0 : Math.min(1800, 300 + item.text.length * 170));
      return;
    }
    /* rule 3: our last request may have timed out locally while the engine is still talking -> wait for the engine,
       and if it stays busy, recover through the one cancel path; right after a recovery the engine's flag is not trusted */
    if ((s.speaking || s.pending) && now() - this.recoverAt > 2000) {
      if (!this.busySince) this.busySince = now();
      if (now() - this.busySince < (fast() ? 30 : 1200)) { this.schedulePump(fast() ? 5 : 150); return; }
      this.busySince = 0; this.recoverAt = now();
      this.cancelEngine('recover');
      this.schedulePump(160); return;
    }
    this.busySince = 0;
    try { s.resume(); } catch (e) {}   /* rule 4: resume before every speak */
    this.speakNow(this.q.shift());
  },
  /* a recorded sentence: the same request life as a spoken one (cur, end, timeout, cancel) */
  playClip(item, buf) {
    const c = Sfx.ctx;
    item.t0 = now(); this.cur = item; this.lastReqAt = now();
    slog('narr', item.text, item.tag, 'speak');
    const s = c.createBufferSource(); s.buffer = buf;
    const g = c.createGain(); g.gain.value = 1.0; s.connect(g); g.connect(c.destination);
    Sfx.track(s);
    item.clip = s; item.heard = true; item.rec = true;
    this.bindEnd(item, null, buf.duration);
    s.onended = () => item.finish && item.finish('end');
    Sfx.duck(buf.duration + 0.3);
    try { s.start(); } catch (e) { item.finish('error'); }
  },
  busy() { return !!(this.cur || this.q.length); },
  /* afterSay(minMs): resolves when narration is idle AND at least minMs passed */
  afterSay(minMs) {
    const t0 = now(), min = T(minMs || 0), owner = speechOwner();
    return new Promise(res0 => { const res = () => { if (ownerAlive(owner)) res0(); }; this.waiters.push({ res, t0, min }); this.checkWaiters(); });
  },
  checkWaiters() {
    if (this.busy()) return;
    const keep = [];
    for (const w of this.waiters) {
      const left = w.min - (now() - w.t0);
      if (left <= 0) w.res(); else { keep.push(w); setTimeout(() => this.checkWaiters(), left + 2); }
    }
    this.waiters = keep;
  },
  diag() {
    const s = this.synth;
    return {
      supported: !!s, voices: this.voices.length, zh: this.zh.map(v => v.name + ' (' + v.lang + ')' + (v.localService ? '' : ' ☁')),
      selected: this.voice ? this.voice.name + ' (' + this.voice.lang + ')' : '系统默认',
      engineActive: this.engineActive, firstConfirmed: this.firstConfirmed, fails: this.fails, oks: this.oks, silent: this.silent,
      speaking: s ? s.speaking : false, pending: s ? s.pending : false,
      ctx: Sfx.ctx ? Sfx.ctx.state : 'none', audioLog: Sfx.log.slice(-8), count: Count.stats(),
    };
  },
};

/* -------------------------------------------------------------- counting channel (rule 10)
   pre-generated neural-TTS mp3 through WebAudio; newest number wins; every request carries a sequence number and its owner,
   so a late decode never speaks for a question that is gone; if the mp3 path fails the word goes to the narration
   engine as a PROTECTED sentence that a tap or submit cannot cut */
const Count = {
  bufs: {}, fails: {}, loading: {}, src: null, req: 0, played: 0, fallbacks: 0,
  name(n, kind) { return (kind === 'o' ? 'o' : 'n') + n; },
  word(n, kind) { return (kind === 'o' ? '第' : '') + CN[n]; },
  load(name) {
    if (this.bufs[name]) return Promise.resolve(this.bufs[name]);
    if (this.fails[name]) return Promise.resolve(null);
    if (this.loading[name]) return this.loading[name];
    const c = Sfx.ensure();
    if (!c) { this.fails[name] = 1; return Promise.resolve(null); }
    const p = fetch('assets/voice/' + name + '.mp3').then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(ab => new Promise((res, rej) => { const q = c.decodeAudioData(ab, res, rej); if (q && q.then) q.then(res, rej); }))
      .then(b => { this.bufs[name] = b; delete this.loading[name]; return b; })
      .catch(() => { this.fails[name] = 1; delete this.loading[name]; return null; });
    this.loading[name] = p;
    return p;
  },
  preload(max) { for (let i = 1; i <= (max || 10); i++) this.load('n' + i); for (let i = 1; i <= 7; i++) this.load('o' + i); },
  say(n, kind) {
    if (!(n >= 1 && n <= 20)) return;
    const name = this.name(n, kind), word = this.word(n, kind);
    const req = ++this.req, owner = speechOwner();
    slog('count', word, name, 'speak');
    const go = buf => {
      if (req !== this.req || !ownerAlive(owner)) return;        /* a newer number, or its question / session is gone */
      if (buf) this.play(buf, word, owner, req); else this.fallback(word, owner);
    };
    const b = this.bufs[name];
    if (b) go(b); else if (this.fails[name]) go(null); else this.load(name).then(go);
  },
  play(buf, word, owner, req) {
    const c = Sfx.ctx;
    if (!c) { this.fallback(word, owner); return; }
    if (c.state === 'running') { this.start(buf); return; }
    /* suspended (background, interruption): resume; play only if this is still the newest valid number, else say it */
    let settled = false;
    const done = ok => { if (settled) return; settled = true; clearTimeout(t); if (req !== this.req || !ownerAlive(owner)) return; if (ok && c.state === 'running') this.start(buf); else this.fallback(word, owner); };
    const t = setTimeout(() => done(false), 350);
    try { const p = c.resume(); if (p && p.then) p.then(() => done(true), e => { Sfx.note('resume-rejected', e); done(false); }); else done(c.state === 'running'); } catch (e) { done(false); }
  },
  start(buf) {
    const c = Sfx.ctx;
    if (this.fallbacks) Voice.dropTag('count-fallback');
    if (this.src) { try { this.src.stop(); } catch (e) {} }
    const s = c.createBufferSource(); s.buffer = buf;
    const g = c.createGain(); g.gain.value = 1.15;
    s.connect(g); g.connect(c.destination);
    Sfx.track(s);
    s.start(); this.src = s; this.played++;
    Sfx.duck(buf.duration);
    s.addEventListener('ended', () => { if (this.src === s) this.src = null; });
  },
  /* R4-I02: a system count (reveal, correction) waits for the number to be said (+60 ms), never less than `min`.
     A child's quick taps still cut the older number: then only the newest one plays - the child's own tempo */
  beat(sc, min, n, kind) { this.say(n, kind); const b = this.bufs[this.name(n, kind)]; return sc.wait(Math.max(min, b ? Math.round(b.duration * 1000) + 60 : (n > 10 ? 640 : 0))); },
  fallback(word, owner) { this.fallbacks++; slog('count', word, 'fallback', 'speak'); Voice.say(word, { tag: 'count-fallback', prot: true, latest: true, owner }); },
  /* leaving a session: no number of the old session may sound afterwards */
  stop() { this.req++; if (this.src) { try { this.src.stop(); } catch (e) {} this.src = null; } },
  stats() { return { loaded: Object.keys(this.bufs).length, failed: Object.keys(this.fails).length, played: this.played, fallbacks: this.fallbacks }; },
};


/* ================================================================ STAGE
   logical stage 1024x704 (landscape) / 704x1024 (portrait), contain-scaled (scale >= 1 on every iPad)
   background: square image, cover-scaled to the viewport; bgPoint() maps image anchors -> stage coords
   ================================================================ */
const Stage = {
  W: 1024, H: 704, portrait: false, s: 1, ox: 0, oy: 0,
  el: null, bg: null, onRelayout: null,
  init() {
    this.el = $('#stage'); this.bg = $('#gbg');
    this.fit(true);
    let t = 0;
    const re = () => { clearTimeout(t); t = setTimeout(() => this.fit(false), 60); };
    window.addEventListener('resize', re);
    window.addEventListener('orientationchange', re);
  },
  fit(first) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const was = this.portrait;
    this.vw = vw; this.vh = vh;
    this.portrait = vh > vw * 1.02;
    this.W = this.portrait ? 704 : 1024; this.H = this.portrait ? 1024 : 704;
    this.s = Math.min(vw / this.W, vh / this.H);
    this.ox = (vw - this.W * this.s) / 2; this.oy = (vh - this.H * this.s) / 2;
    const st = this.el.style;
    st.width = this.W + 'px'; st.height = this.H + 'px';
    st.transform = 'translate(' + this.ox + 'px,' + this.oy + 'px) scale(' + this.s + ')';
    if (!first && this.onRelayout) this.onRelayout(was !== this.portrait);
    if (!first && typeof MapView !== 'undefined') MapView.layout();
  },
  toStage(cx, cy) { return { x: (cx - this.ox) / this.s, y: (cy - this.oy) / this.s }; },
  toScreen(x, y) { return { x: this.ox + x * this.s, y: this.oy + y * this.s }; },
  /* square background drawn with background-size:cover on the full viewport */
  bgPoint(u, v) {
    const D = Math.max(this.vw, this.vh), x0 = (this.vw - D) / 2, y0 = (this.vh - D) / 2;
    return this.toStage(x0 + u * D, y0 + v * D);
  },
};

/* ================================================================ INPUT
   four adapters (+ hold): station tap / region sweep / quantized rotation / corridor (drag, flick)
   every real gesture becomes one call:  __gesture(name, payload)  -- tests use the same entry
   ================================================================ */
const Input = {
  cur: null, fails: 0, enabled: true,
  init() {
    const root = $('#game');
    root.addEventListener('pointerdown', e => this.down(e));
    window.addEventListener('pointermove', e => this.move(e), { passive: false });
    window.addEventListener('pointerup', e => this.up(e));
    window.addEventListener('pointercancel', e => this.cancel(e));
    ['contextmenu', 'gesturestart', 'gesturechange', 'dblclick', 'selectstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let lastEnd = 0;
    document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastEnd < 320) e.preventDefault(); lastEnd = t; }, { passive: false });
  },
  bind(e, spec) { e.classList.add('tgt'); e._spec = spec; e.dataset.gid = spec.id; return e; },
  unbind(e) { if (e) { delete e._spec; delete e.dataset.gid; e.classList.remove('tgt'); } },
  pt(e) { return Stage.toStage(e.clientX, e.clientY); },
  down(e) {
    Sfx.touch();
    const t = e.target.closest ? e.target.closest('[data-gid]') : null;
    if (this.cur) return;                                    /* one finger at a time */
    if (!t || !t._spec) {
      if (e.target.closest && e.target.closest('#ff')) { gesture('skip', {}); }
      return;
    }
    const spec = t._spec;
    if (spec.disabled) return;
    const p = this.pt(e);
    this.cur = { el: t, spec, id: spec.id, pid: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t0: now(), path: [p], moved: false, rot: null, acc: 0, units: 0, passed: [], rev: 0, lastDx: 0, holdT: 0, done: false };
    try { t.setPointerCapture(e.pointerId); } catch (err) {}
    t.classList.add('press');
    Sfx.press();
    if (spec.hold) {
      const c = this.cur;
      c.holdT = setTimeout(() => { if (this.cur === c && !c.moved) { c.done = true; t.classList.remove('press'); if (spec.onHoldEnd) spec.onHoldEnd(true); gesture('hold', { id: spec.id }); } }, T(spec.hold));
      if (spec.onHoldStart) spec.onHoldStart();
    }
    if (spec.slide) this.slideStep(p);
    if (e.cancelable) e.preventDefault();
  },
  move(e) {
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    const p = this.pt(e), sp = c.spec;
    const dx = p.x - c.x0, dy = p.y - c.y0;
    if (!c.moved && Math.hypot(dx, dy) > 10) { c.moved = true; if (sp.hold && !sp.holdMoveOk) { clearTimeout(c.holdT); if (sp.onHoldEnd) sp.onHoldEnd(false); } }
    c.path.push(p); if (c.path.length > 400) c.path.splice(1, 1);
    if (sp.drag && c.moved) {
      c.el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.08) rotate(' + clamp(dx * 0.04, -8, 8) + 'deg)';
      if (c.z0 === undefined) c.z0 = c.el.style.zIndex;        /* its own layer, given back on release */
      c.el.style.zIndex = 45;
      if (sp.onDragMove) sp.onDragMove(p);
    }
    if (sp.rotate) {
      const RS = typeof sp.rotate === 'function' ? sp.rotate() : sp.rotate;
      const cx = RS.cx, cy = RS.cy;
      const a = Math.atan2(p.y - cy, p.x - cx);
      if (c.rot != null) { let d = a - c.rot; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; c.acc += d; }
      c.rot = a;
      const step = (RS.step || 60) * Math.PI / 180;
      while (c.acc >= step) { c.acc -= step; c.emitted = true; gesture('rotate', { id: sp.id, dir: 1 }); }
      while (c.acc <= -step) { c.acc += step; c.emitted = true; gesture('rotate', { id: sp.id, dir: -1 }); }
    }
    if (sp.stretch) {
      const SS = typeof sp.stretch === 'function' ? sp.stretch() : sp.stretch;
      const ax = SS.axis === 'y' ? -dy : dx;
      const u = Math.floor((ax + SS.unit * 0.5) / SS.unit);
      if (u !== c.units) { c.emitted = true; gesture('stretch', { id: sp.id, delta: u - c.units }); c.units = u; }
    }
    if (sp.rub) {
      const ddx = p.x - c.x; if (Math.abs(ddx) > 6) { if (c.lastDx && Math.sign(ddx) !== Math.sign(c.lastDx)) c.rev++; c.lastDx = ddx; }
      if (!c.done && (c.rev >= 2 || this.pathLen(c.path) > 160)) { c.done = true; c.el.classList.remove('press'); gesture('rub', { id: sp.id }); }
    }
    if (sp.slide) this.slideStep(p);
    c.x = p.x; c.y = p.y;
    if (e.cancelable) e.preventDefault();
  },
  slideStep(p) {
    const c = this.cur, sp = c.spec;
    let hit = null, bd = 1e9;   /* nearest station whose widened corridor contains the finger */
    sp.slide.forEach(s => { const b = s.rect(); if (p.x >= b.x - b.w * 0.25 && p.x <= b.x + b.w * 1.25 && p.y >= b.y - b.h * 0.25 && p.y <= b.y + b.h * 1.25) { const d = Math.hypot(p.x - b.x - b.w / 2, p.y - b.y - b.h / 2); if (d < bd) { bd = d; hit = s; } } });
    if (hit && c.passed[c.passed.length - 1] !== hit.id) { c.passed.push(hit.id); gesture('pass', { id: sp.id, at: hit.id }); }
  },
  pathLen(path) { let L = 0; for (let i = 1; i < path.length; i++) L += Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y); return L; },
  within(e, p, k) {
    const b = e._box ? e._box() : box(e);
    const mx = b.w * (k - 1) / 2, my = b.h * (k - 1) / 2;
    return p.x >= b.x - mx && p.x <= b.x + b.w + mx && p.y >= b.y - my && p.y <= b.y + b.h + my;
  },
  up(e) {
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null;
    const sp = c.spec, t = c.el, p = this.pt(e);
    clearTimeout(c.holdT);
    t.classList.remove('press');
    try { t.releasePointerCapture(e.pointerId); } catch (err) {}
    if (c.done) return;
    if (sp.hold && !c.moved) { if (sp.onHoldEnd) sp.onHoldEnd(false); if (sp.tapOk) return this.emitTap(sp); return; }
    if (sp.slide) { const last = c.passed[c.passed.length - 1]; if (last) { gesture('pick', { id: sp.id, at: last }); return; } }
    if (sp.drag && c.moved) {
      const drop = this.findDrop(sp, p);
      if (drop) { t.style.zIndex = c.z0 || ''; gesture('drop', { id: sp.id, to: drop }); this.fails = 0; }
      else { this.snapBack(t, c.z0); this.fail(); }
      if (sp.onDragEnd) sp.onDragEnd(!!drop);
      return;
    }
    if (sp.arc && c.moved) { if (this.isArc(c.path)) { gesture('arc', { id: sp.id }); this.fails = 0; } else this.fail(); return; }
    if ((sp.swipe || sp.flick) && c.moved) {
      const dx = p.x - c.x0, dy = p.y - c.y0, L = Math.hypot(dx, dy);
      if (L < 30) { this.fail(); return; }
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (sp.swipe) {
        const dirs = { right: 0, down: 90, left: 180, up: -90 };
        const d = Object.keys(dirs).find(k => Math.abs(((ang - dirs[k] + 540) % 360) - 180) <= 35);
        if (d && sp.swipe.includes(d)) { gesture('swipe', { id: sp.id, dir: d }); this.fails = 0; } else this.fail();
      } else {
        const tg = (typeof sp.flick === 'function' ? sp.flick() : sp.flick).find(f => { const cc = f.center(); const ta = Math.atan2(cc.y - c.y0, cc.x - c.x0) * 180 / Math.PI; return Math.abs(((ang - ta + 540) % 360) - 180) <= 35; });
        if (tg) { gesture('drop', { id: sp.id, to: tg.id }); this.fails = 0; } else this.fail();
      }
      return;
    }
    if (sp.sweep && c.moved) {
      const ids = [];
      sp.sweep().forEach(r => { if (c.path.some(q => { const b = r.rect(); return q.x >= b.x - b.w * 0.25 && q.x <= b.x + b.w * 1.25 && q.y >= b.y - b.h * 0.25 && q.y <= b.y + b.h * 1.25; })) ids.push(r.id); });
      if (ids.length) { gesture('sweep', { id: sp.id, ids }); this.fails = 0; } else this.fail();
      return;
    }
    if (sp.rotate || sp.stretch) {
      if (sp.onRelease) sp.onRelease();
      if (!c.emitted && (!c.moved || this.within(t, p, 1.5))) this.emitTap(sp);   /* nothing turned / stretched: it was a tap */
      return;
    }
    if (!c.moved || this.within(t, p, 1.5)) this.emitTap(sp);
  },
  emitTap(sp) { if (sp.tap === false) return; gesture('tap', { id: sp.id }); this.fails = 0; },
  cancel(e) {
    const c = this.cur; if (!c || e.pointerId !== c.pid) return;
    this.cur = null; clearTimeout(c.holdT);
    c.el.classList.remove('press');
    if (c.spec.drag && c.moved) this.snapBack(c.el, c.z0);
    if (c.spec.hold && c.spec.onHoldEnd) c.spec.onHoldEnd(false);
  },
  /* rotation / exit / teardown: drop any gesture in flight, objects spring home */
  abort() {
    const c = this.cur; if (!c) return;
    this.cur = null; clearTimeout(c.holdT);
    try { c.el.releasePointerCapture(c.pid); } catch (err) {}
    c.el.classList.remove('press');
    if (c.spec.drag && c.moved) this.snapBack(c.el, c.z0);
    if (c.spec.hold && c.spec.onHoldEnd) c.spec.onHoldEnd(false);
  },
  findDrop(sp, p) {
    const drops = typeof sp.drops === 'function' ? sp.drops() : (sp.drops || []);
    let best = null, bd = 1e9;
    drops.forEach(d => {
      const b = d.rect(); const mx = b.w * 0.25, my = b.h * 0.25;
      if (p.x >= b.x - mx && p.x <= b.x + b.w + mx && p.y >= b.y - my && p.y <= b.y + b.h + my) {
        const dd = Math.hypot(p.x - (b.x + b.w / 2), p.y - (b.y + b.h / 2));
        if (dd < bd) { bd = dd; best = d.id; }
      }
    });
    return best;

  async arc(scope, x0, y0, x1, y1) { await this.go(scope, x0, y0); const h = this.make(); const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 90; await scope.anim(h, [{ left: (x0 - 22) + 'px', top: (y0 - 6) + 'px' }, { left: (mx - 22) + 'px', top: (my - 6) + 'px' }, { left: (x1 - 22) + 'px', top: (y1 - 6) + 'px' }], { duration: 800, easing: EASE.glide, commit: true }); h.style.left = (x1 - 22) + 'px'; h.style.top = (y1 - 6) + 'px'; },

/* ================================================================ MASTERY (evidence per game x kind; see DESIGN §6) */
const MAXLV = { peppa: 3, bluey: 3, huluwa: 4, paw: 4, xiyou: 4, avengers: 4 };
const REQUIRED = {
  P1: ['sub'], P2: ['pair'], P3: ['card'], P4: ['giveN'],
  B1: ['more', 'less', 'same'], B2: ['match'], B3: ['same', 'add', 'remove'], B4: ['diff'],
  H1: ['ord'], H2: ['ord', 'card'], H3: ['in', 'out'], H4: ['hidden'],
  A1: ['split2'], A2: ['all'], A3: ['plus', 'minus'], A4: ['on'],
  X1: ['target'], X2: ['line'], X3: ['ten'], X4: ['hidden'],
  V1: ['on'], V2: ['build', 'name'], V3: ['split10', 'sum10'], V4: ['n2q', 'q2n'],
};
const budgetFor = lv => (lv === 1 ? 5 : lv === 4 ? 4 : 7);
const SILENT_ALT = { giveN: 'giveNvis' };
const Mastery = {
  gs(ws, g) { ws.g = ws.g || {}; return ws.g[g] || (ws.g[g] = { n: 0, c: 0, bits: [], k: {} }); },
  record(G, st, ok) {
    const ws = G.ws;
    ws.log = ws.log || [];
    ws.log.push({ g: G.id, k: st.evKind || st.kind, ok: ok ? 1 : 0, ev: st.evidence && !st.hinted ? 1 : 0, h: st.hinted ? 1 : 0, gd: st.guided ? 1 : 0, pr: st.probe ? 1 : 0, lv: st.level, t: Date.now() });
    if (ws.log.length > 40) ws.log.splice(0, ws.log.length - 40);
    if (!st.evidence || st.hinted || st.guided || st.demo || st.noEvidence) { Store.save(); return false; }
    const b = ok ? 1 : 0;
    if (!st.probe) { ws.win.push({ g: G.id, ok: b }); if (ws.win.length > 12) ws.win.splice(0, ws.win.length - 12); }
    ws.hist.push(b); if (ws.hist.length > 12) ws.hist.splice(0, ws.hist.length - 12);
    ws.mastery += b;
    const gs = this.gs(ws, G.id);
    gs.n++; gs.c += b; gs.bits.push(b); if (gs.bits.length > 8) gs.bits.splice(0, gs.bits.length - 8);
    if (st.game.variety) { gs.v = gs.v || []; gs.v.push(b ? st.game.variety(st) : '-'); if (gs.v.length > 8) gs.v.splice(0, gs.v.length - 8); }
    const kk = this.kindKey(st.evKind || st.kind);
    if (b) gs.k[kk] = (gs.k[kk] || 0) + 1;
    G.ev.push(b);
    if (!st.probe) this.adapt(G);
    this.checkGate(G.world);
    Unlock.check(true);
    Store.save();
    return true;
  },
  kindKey(k) { if (k === 'selfsplit') return 'in'; if (!digits()) { if (k === 'n2q') return 'd2q'; if (k === 'q2n') return 'q2d'; } return k; },
  adapt(G) {
    const ws = G.ws, max = MAXLV[G.world];
    const w7 = ws.win.slice(-7);
    const games = new Set(w7.map(x => x.g));
    if (w7.length >= 7 && w7.reduce((s, x) => s + x.ok, 0) >= 6 && w7.slice(-3).every(x => x.ok) && games.size >= 2 && ws.level < max) {
      ws.level++; ws.win = []; G.levelUp = true;
      return;
    }
    const w4 = ws.win.slice(-4);
    if (w4.length >= 4 && w4.reduce((s, x) => s + x.ok, 0) <= 1 && ws.level > ws.floor) { ws.level--; ws.win = []; }
  },
  guidedRound(G, guided) {
    const ws = G.ws;
    ws.guidedRun = guided ? ws.guidedRun + 1 : 0;
    if (ws.guidedRun >= 3) { ws.guidedRun = 0; if (ws.level > ws.floor) { ws.level--; ws.win = []; } }
  },
  sessionEnd(G) {
    const ws = G.ws;
    if (G.ev.length >= 4 && G.ev.reduce((s, x) => s + x, 0) / G.ev.length >= 0.75) ws.windows++;
    this.checkGate(G.world);
    Unlock.check(true);
    Store.save();
  },
  gateReport(wid) {
    const ws = Store.w(wid), W = WORLDS[wid];
    const acc = ws.hist.length ? ws.hist.reduce((s, x) => s + x, 0) / ws.hist.length : 0;
    /* per game: at least 7 independent answers, 6 of the last 7 right, the last one right, every required kind shown.
       The position / rank bags deal every place exactly once per three questions, so "always the left card" (or the
       biggest, ...) is right at most 3 times in any 7 - it can never pass; blind guessing passes a window with p < 0.7 %. */
    const per = W.games.map(g => {
      const gs = (ws.g && ws.g[g]) || { n: 0, c: 0, bits: [], k: {} };
      const b7 = gs.bits.slice(-7), right7 = b7.reduce((s, x) => s + x, 0);
      const recent = b7.length ? right7 / b7.length : 0;
      const kinds = REQUIRED[g].map(k => this.kindKey(k)).filter((k, i, a) => a.indexOf(k) === i);
      /* on a device that cannot speak, a required heard kind is met by its seen twin (P4: giveN <- giveNvis) */
      const alt = k => (Voice.silent || visualMode()) && SILENT_ALT[k] && (gs.k[SILENT_ALT[k]] || 0) >= 1;
      const kindsOk = kinds.every(k => (gs.k[k] || 0) >= 1 || alt(k));
      /* self-made splits (H3) must vary: among the last 7 right answers >= 3 different cave parts AND >= 2 different
         outside parts - "always send one" and "always keep one outside" both stay shut (R3-J01) */
      const vv = (gs.v || []).slice(-7).filter(x => x !== '-').map(x => x.split(':'));
      const varOk = !(GAMES[g] && GAMES[g].variety) || (new Set(vv.map(x => x[0])).size >= 3 && new Set(vv.map(x => x[1])).size >= 2);
      const seen = kinds.some(k => !((gs.k[k] || 0) >= 1) && alt(k));
      return { g, c: gs.c, n: gs.n, recent, right7, kindsOk, varOk, seen, ok: b7.length >= 7 && right7 >= 6 && b7[b7.length - 1] === 1 && kindsOk && varOk };
    });
    const ok = ws.level >= 2 && ws.windows >= 2 && ws.hist.length >= 8 && acc >= 0.75 && per.every(p => p.ok);
    return { ok, level: ws.level, windows: ws.windows, acc, histN: ws.hist.length, per };
  },
  checkGate(wid) {
    const ws = Store.w(wid);
    if (!ws.cleared && this.gateReport(wid).ok) {
      ws.cleared = true;
    }
  },
};

/* bags: balanced sequences that defeat fixed-position / fixed-rank / fixed-meaning strategies */
function bagPick(G, name, items) {
  const b = G.bags[name] || (G.bags[name] = []);
  if (!b.length) b.push(...G.rng.shuffle(items));
  return b.shift();
}
/* three numeric options for answer cards; rank of the correct value balanced by the size bag */
/* The RANK of the correct value among the three (smallest / middle / largest) is dealt from a bag, restricted to the
   ranks this value allows inside [lo, hi]; a rank that does not fit stays in the bag for a later question. So "always
   the smallest / middle / largest card" is right about one time in three over any stretch - also at the range ends. */
function numOptions(G, n, lo, hi) {
  lo = lo == null ? 1 : lo; hi = hi == null ? 20 : hi;

   then the gesture (how to act, never the answer) · 15 s a kind word + the question · then now and then again, waiting
   as long as it takes. CLIENT RULE: the helper never does a step, never shows the answer, and a star is only ever
   earned by the child's own right answer.
   One thing at a time: a cue first, its hint only after it and only if the child has not acted meanwhile.

    this.update();
    await this.specials(live);

/* ================================================================ PARENT (long-press gear -> keypad gate -> panel) */
const Parent = {
  initGear() {
    const g = $('#gear'), ring = $('circle', $('.ring', g));

    const cancel = () => { clearTimeout(t); t = 0; pid = null; g.classList.remove('press'); if (anim) { anim.cancel(); anim = null; } ring.style.strokeDashoffset = 145; };
    g.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      pid = e.pointerId; sx = e.clientX; sy = e.clientY;
      try { g.setPointerCapture(pid); } catch (err) {}
      g.classList.add('press');
      anim = ring.animate([{ strokeDashoffset: 145 }, { strokeDashoffset: 0 }], { duration: 1600, fill: 'forwards' });
      t = setTimeout(() => { cancel(); this.open(); }, 1600);
    });
    g.addEventListener('pointermove', e => { if (e.pointerId === pid && Math.hypot(e.clientX - sx, e.clientY - sy) > 26) cancel(); });
    g.addEventListener('pointerup', e => { if (e.pointerId !== pid) return; const short = !!t; cancel(); if (short) this.toast('家长你好：请按住小齿轮'); });
    g.addEventListener('pointercancel', cancel);
    g.addEventListener('contextmenu', e => e.preventDefault());

  },
  fireworks(sc) {
    const cv = $('canvas', $('#finale')), cx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = window.innerWidth * dpr; cv.height = window.innerHeight * dpr; cx.scale(dpr, dpr);
    let parts = [];
    const cols = ['#FFC93C', '#FF6B5B', '#4FB3FF', '#5CC46E', '#8E6CFF', '#FF9F43', '#FF7FA8'];
    const boom = () => { const x = window.innerWidth * (0.15 + Math.random() * 0.7), y = window.innerHeight * (0.1 + Math.random() * 0.3), c = cols[Math.floor(Math.random() * cols.length)]; for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2, v = 2 + Math.random() * 2.5; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 60 + Math.random() * 20, c }); } Sfx.nz(0, 0.3, 900, 200, 0.8, 0.12, 'lowpass'); };
    let alive = true;
    sc.add(() => { alive = false; cx.clearRect(0, 0, cv.width, cv.height); });
    const tick = () => {
      if (!alive) return;
      cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      parts = parts.filter(p => p.l > 0);
      parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.l--; cx.globalAlpha = Math.max(0, p.l / 80); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, 3.2, 0, 7); cx.fill(); });
      cx.globalAlpha = 1;
      requestAnimationFrame(tick);
    };
    tick();
    sc.interval(boom, 700);
    boom();
  },
  stop() { if (this.sc) { this.sc.dispose(); this.sc = null; } },
};

/* ================================================================ STORY (D05: coming back is worth it)
   3rd visit of a world: the host brings a present - a flower that is planted on the island (map)
   5th visit: the friends line up and welcome the child one by one - a second flower
   10th visit: the host gets a hat and keeps wearing it; the island flies a little pennant
   each chapter plays once; what it leaves behind stays (Store: ws.story) */
const FLOWER_SVG = c => '<svg viewBox="0 0 60 60" width="100%" height="100%"><path d="M30 34V58" stroke="#3E8E3E" stroke-width="5" stroke-linecap="round"/><path d="M30 50C22 44 14 46 12 50C18 54 26 54 30 50Z" fill="#5CC46E" stroke="#2B2118" stroke-width="2.5"/><g stroke="#2B2118" stroke-width="3"><circle cx="30" cy="12" r="9" fill="' + c + '"/><circle cx="42" cy="21" r="9" fill="' + c + '"/><circle cx="38" cy="35" r="9" fill="' + c + '"/><circle cx="22" cy="35" r="9" fill="' + c + '"/><circle cx="18" cy="21" r="9" fill="' + c + '"/><circle cx="30" cy="24" r="7.5" fill="#FFC93C"/></g></svg>';
const GIFT_SVG = '<svg viewBox="0 0 80 80" width="100%" height="100%"><rect x="12" y="34" width="56" height="38" rx="5" fill="#FF6B5B" stroke="#2B2118" stroke-width="4"/><rect x="36" y="34" width="8" height="38" fill="#FFC93C" stroke="#2B2118" stroke-width="3"/><g class="lid"><rect x="8" y="24" width="64" height="14" rx="5" fill="#FF8A7A" stroke="#2B2118" stroke-width="4"/><rect x="36" y="24" width="8" height="14" fill="#FFC93C" stroke="#2B2118" stroke-width="3"/><path d="M40 24C30 6 16 12 26 23M40 24C50 6 64 12 54 23" fill="#FFC93C" stroke="#2B2118" stroke-width="3"/></g></svg>';
const PENNANT_SVG = '<svg viewBox="0 0 40 60" width="100%" height="100%"><path d="M8 4V58" stroke="#2B2118" stroke-width="4" stroke-linecap="round"/><path d="M10 6L36 14L10 24Z" fill="#FFC93C" stroke="#2B2118" stroke-width="3" stroke-linejoin="round"/></svg>';
const Story = {
  chapter(v) { return v >= 10 ? 3 : v >= 5 ? 2 : v >= 3 ? 1 : 0; },
  host(G) { const h = G.actors[G.game.host || G.W.host]; return h && !h.math ? h : Object.values(G.actors).find(a => !a.math) || null; },
  intro(G) {
    const ws = G.ws, ch = this.chapter(ws.visits);
    const host = this.host(G);
    if ((ws.story || 0) >= 3 && host) this.wearHat(host);                   /* what a chapter gave stays */
    if (ch <= (ws.story || 0) || fast()) return { line: null };
    ws.story = ch; Store.save();
    if (ch === 1) return { line: '又见面啦！', play: () => this.gift(G, host) };
    if (ch === 2) return { line: '大家排好队，欢迎你！', play: () => this.lineup(G) };
    return { line: '你来了十次啦！', play: () => this.hat(G, host) };
  },
  async gift(G, host) {
    const sc = G.scope;
    const x = host ? clamp(host.x + (host.x < Stage.W / 2 ? 150 : -150), 120, Stage.W - 120) : Stage.W / 2, y = host ? host.y - 70 : Stage.H * 0.6;
    const g = el('div', '', Stage.el); g.innerHTML = GIFT_SVG; place(g, x - 60, y - 60, 120, 120); g.style.zIndex = 25;
    sc.add(() => g.remove());
    Sfx.whoosh(0.3);
    await sc.anim(g, [{ transform: 'translateY(-420px) rotate(-12deg)' }, { transform: 'translateY(0) rotate(0)' }], { duration: 520, easing: EASE.drop });
    Sfx.land(); if (host) { host.lookAt(x, y); host.react(); }
    await sc.wait(350);
    const lid = g.querySelector('.lid');
    sc.anim(lid, [{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(6px,-34px) rotate(18deg)' }], { duration: 300, easing: EASE.pop, fill: 'forwards' });
    const f = el('div', '', Stage.el); f.innerHTML = FLOWER_SVG('#FF7FA8'); place(f, x - 40, y - 70, 80, 80); f.style.zIndex = 26;
    sc.add(() => f.remove());
    Sfx.sparkle(); Voice.say('送你一朵小花！', { tag: 'story', owner: G });
    await sc.anim(f, [{ transform: 'scale(0) translateY(40px)' }, { transform: 'scale(1.25) translateY(-30px)' }, { transform: 'scale(1) translateY(-30px)' }], { duration: 600, easing: EASE.pop });
    Fx.burst(x, y - 60, { n: 14, dist: 90 });
    await sc.wait(900);
    const a = $('#avatar').getBoundingClientRect(), s0 = Stage.toStage(a.left + a.width / 2, a.top + a.height / 2);
    await sc.anim(f, [{ transform: 'translate(0,-30px) scale(1)' }, { transform: 'translate(' + (s0.x - x) + 'px,' + (s0.y - y + 40) + 'px) scale(.3)', opacity: 0.2 }], { duration: 700, easing: EASE.glide, fill: 'forwards' });
    f.remove();
    await sc.anim(g, [{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
    g.remove();
  },
  async lineup(G) {
    const sc = G.scope;
    const list = Object.values(G.actors).filter(a => !a.math && a.x > 0 && a.x < Stage.W).sort((a, b) => a.x - b.x);
    if (!list.length) return;
    /* they walk into ONE welcome line in front of the child (then back to their places) */
    const home = list.map(a => ({ x: a.x, y: a.y })), gap = Math.min(150, (Stage.W - 160) / Math.max(1, list.length - 1));
    const y = Stage.H * (K.L() ? 0.86 : 0.8), x0 = Stage.W / 2 - gap * (list.length - 1) / 2;
    await Promise.all(list.map((a, i) => sc.wait(i * 120).then(() => a.moveTo(x0 + i * gap, y, 620, 50))));
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      sc.anim(a.body, REACT.hop, { duration: 420, fill: 'none' });
      Sfx.mar(Sfx.SCALE[Math.min(i, 9)], 0, 0.4, 0.5);
      await sc.wait(230);
    }
    list.forEach(a => a.cheer());
    Fx.confetti(24);
    await sc.wait(700);
    await Promise.all(list.map((a, i) => a.moveTo(home[i].x, home[i].y, 520, 30)));
  },
  async hat(G, host) {
    if (!host) return;
    const sc = G.scope;
    const hat = this.wearHat(host);
    Sfx.whoosh(0.3);
    await sc.anim(hat, [{ transform: 'translateY(-300px) rotate(-30deg)', opacity: 0 }, { transform: 'translateY(0) rotate(0)', opacity: 1 }], { duration: 650, easing: EASE.pop });
    Sfx.boing(); host.react();
    await sc.wait(600);
  },
  wearHat(host) {
    let hat = host.root.querySelector('.hat');
    if (!hat) { hat = img('assets/props/hat.png', 'hat', host.root); Object.assign(hat.style, { width: '34%', left: '33%', top: '-16%' }); }
    return hat;
  },
  /* the map shows what the chapters left behind */
  mapDeco(I, ws) {
    const n = ws.story || 0;
    if (I.deco._n === n) return;
    I.deco._n = n; I.deco.innerHTML = '';
    if (n >= 1) el('div', 'fl', I.deco).innerHTML = FLOWER_SVG('#FF7FA8');
    if (n >= 2) el('div', 'fl', I.deco).innerHTML = FLOWER_SVG('#8E6CFF');
    if (n >= 3) el('div', 'pen', I.deco).innerHTML = PENNANT_SVG;
  },
};

/* stack the two plates in the middle, line each plate's items up in a row, pair them one-to-one.
   returns the unpaired items (the "extra" that shows who has more) */
async function stackCompare(st, plateA, A, plateB, B, hide) {
  const L = K.L(), n = Math.max(A.length, B.length, 1);
  const pw = 300, ph = 190, cx = Stage.W / 2;
  const yA = L ? 140 : 250, yB = L ? 372 : 482;                   /* two plates, a clear gap between them */
  (hide || []).forEach(e => st.scope.anim(e, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 }));      /* out of the plates' way */
  const sz = n > 5 ? 36 : 46, gap = Math.min(50, (pw - 90) / Math.max(1, n - 1));
  const x0 = cx - (n - 1) * gap / 2;
  await Promise.all([K.flyTo(st, plateA, cx - pw / 2, yA, 420), K.flyTo(st, plateB, cx - pw / 2, yB, 420)]);
  [plateA, plateB].forEach(pl => { pl.style.width = pw + 'px'; pl.style.height = ph + 'px'; });
  await Promise.all(A.map((e, i) => { e.style.width = e.style.height = sz + 'px'; return K.flyTo(st, e, x0 + i * gap - sz / 2, yA + ph / 2 - sz / 2, 360); })
    .concat(B.map((e, i) => { e.style.width = e.style.height = sz + 'px'; return K.flyTo(st, e, x0 + i * gap - sz / 2, yB + ph / 2 - sz / 2, 360); })));
  const s = K.lines(st);
  for (let i = 0; i < Math.min(A.length, B.length); i++) {
    if (st.scope.dead) return [];
    K.link(st, s, { x: x0 + i * gap, y: yA + ph / 2 + sz / 2 + 2 }, { x: x0 + i * gap, y: yB + ph / 2 - sz / 2 - 2 }, '#2B2118');
    Sfx.count(i + 1); await st.scope.wait(120);
  }
  return A.length > B.length ? A.slice(B.length) : B.slice(A.length);
}
/* line two sets up in aligned rows and pair them one-to-one; returns the unpaired elements */
async function pairUp(st, A, B, rowA, rowB, x0, x1) {
  const n = Math.max(A.length, B.length), w = Math.min(96, (x1 - x0) / Math.max(1, n));

  const s = K.lines(st);
  for (let i = 0; i < Math.min(A.length, B.length); i++) { K.link(st, s, { x: xs(i), y: rowA + 24 }, { x: xs(i), y: rowB - 24 }, '#2B2118'); Sfx.count(i + 1); await st.scope.wait(110); }
  return A.length > B.length ? A.slice(B.length) : B.slice(A.length);
}

  intro: '谁的多？比一比！', kind0: 'more', praise: ['比得真准！'],
  kinds(level) { return level === 1 ? ['more', 'more', 'same'] : ['more', 'less', 'same']; },
  gen(G, o) {

/* ================================================================ RULE 4 · 接 the missing number on the path */

/* ================================================================ RULE 6 · 归 sort into columns, read the graph */
const MSort = {
  kind0: 'sort', verb: '归！', intro: '分一分！', praise: ['分得清清楚楚！'],
  gen(G, o) {
    const d = o.level, rng = o.rng;
    const ask = d <= 2 ? 'most' : d === 3 ? 'least' : d === 4 ? 'diff' : 'total';
    const kk = (d === 1 || d === 4) ? 2 : 3;
    let counts;
    for (let t = 0; t < 200; t++) {
      counts = Array.from({ length: kk }, () => rng.int(d === 4 ? 2 : 1, d === 4 ? 7 : 5));
      const mx = Math.max(...counts), mn = Math.min(...counts);
      if (ask === 'most' && counts.filter(c => c === mx).length === 1 && mx - [...counts].sort((a, b) => b - a)[1] >= (d === 1 ? 2 : 1)) break;
      if (ask === 'least' && counts.filter(c => c === mn).length === 1) break;
      if (ask === 'diff' && mx !== mn && mx - mn <= 4) break;
      if (ask === 'total' && counts.reduce((a, b) => a + b, 0) <= 13 && counts.reduce((a, b) => a + b, 0) >= 6) break;
    }
    const kinds = rng.shuffle(this.items.slice()).slice(0, kk);
    const total = counts.reduce((a, b) => a + b, 0), mx = Math.max(...counts), mn = Math.min(...counts);
    const answer = ask === 'most' ? counts.indexOf(mx) : ask === 'least' ? counts.indexOf(mn) : ask === 'diff' ? mx - mn : total;
    const list = rng.shuffle(counts.flatMap((c, i) => Array(c).fill(i)));
    return { k: [counts.join(), ask], kinds, counts, ask, list, answer, opts: ask === 'diff' ? numOptions(G, answer, 0, 6) : ask === 'total' ? numOptions(G, answer, 4, 15) : null };
  },
  geo(st) {
    const L = K.L(), kk = st.q.kinds.length;
    return L ? { area: { x: 80, y: 110, w: 420, h: 540 }, cx: c => 560 + c * 128 + (kk === 2 ? 64 : 0), hy: 600, hs: 96 }
      : { area: { x: 50, y: 220, w: 604, h: 300 }, cx: c => 352 + (c - (kk - 1) / 2) * 170, hy: 900, hs: 96 };
  },
  /* landscape: the left half is the heap, the right half the columns - one watcher stands at the far right */
  decor(G) {
    const L = K.L();

  },
  cardSpot(st) { const a = this.geo(st).area; return { cx: a.x + a.w / 2, cy: a.y + a.h / 2 }; },
  stackXY(st, c, k) { const g = this.geo(st); return { x: g.cx(c) - 28, y: g.hy - 62 - k * 50 }; },
  place(st) {

    });

  async reveal(st) {

      K.badge(st, els[els.length - 1] || st.heads[c], q.counts[c], 0, -18, 46);
      await st.scope.wait(260);
    }
    if (q.ask === 'most' || q.ask === 'least') { K.ring(st, this.colEls(st, q.answer).concat([st.heads[q.answer]]).map(e => box(e)), 10, '#FFC93C'); st.heads[q.answer].classList.add('hi'); }
    st.summary = q.ask === 'most' ? '这一列最多！' : q.ask === 'least' ? '这一列最少！' : q.ask === 'diff' ? '多' + CNQ(q.answer) + '个！' : '一共' + CNQ(q.answer) + '个！';
    Sfx.reveal(); this.cheerAll(st);

  async feedback(st, ans) {

    else { if (st.heads[ans]) K.wiggle(st, st.heads[ans]); Voice.say('不是这一列', { tag: 'wrong' }); }

  },
  async correct(st) {
    const q = st.q, my = st;
    Voice.say('每列数一数！', { tag: 'fix' });

    for (let c = 0; c < q.kinds.length; c++) {
      const els = this.colEls(st, c);

  },

  workEls(st) { return st.cards || (st.asked ? st.heads : st.items.filter(o => o.col == null).map(o => o.e)); },

};

/* ================================================================ RULE 7 · 量 how many blocks long */
const MMeasure = {
  kind0: 'measure', verb: '量！', intro: '量一量！', praise: ['量得真准！'],
  gen(G, o) {
    const d = o.level, rng = o.rng;
    const len = d === 1 ? rng.int(3, 5) : d === 2 ? rng.int(4, 6) : d === 3 ? rng.int(5, 8) : d === 4 ? rng.int(6, 9) : rng.int(7, 10);
    return { k: [len], len, answer: len };
  },
  geo() { const L = K.L(); return L ? { u: 72, x0: 152, y: 220, by: 286, box: { x: 60, y: 470, w: 150, h: 140 } } : { u: 56, x0: 72, y: 380, by: 436, box: { x: 92, y: 700, w: 150, h: 140 } }; },
  decor(G) {
    const L = K.L();
    this.chars.forEach((id, i) => { const a = G.actors[id]; if (i === 0) showActor(a, L ? 790 : 470, L ? 698 : 1016, L ? 190 : 150); else if (i === 1) showActor(a, L ? 630 : 330, L ? 698 : 1016, L ? 170 : 140); else hideActor(a); });   /* left of the check button */
  },
  blockXY(k) { const g = this.geo(); return { x: g.x0 + k * g.u + 3, y: g.by }; },
  place(st) {
    const g = this.geo(), q = st.q;
    place(st.obj, g.x0, g.y, q.len * g.u, 44);
    st.obj.innerHTML = ''; st.obj.appendChild(W2P.bar(this.style, q.len * g.u));
    place(st.boxEl, g.box.x, g.box.y, g.box.w, g.box.h);
    place(st.row, g.x0 - 10, g.by - 26, (q.len + 3) * g.u + 20, g.u + 46);
    st.blocks.forEach((e, k) => { const p = this.blockXY(k); place(e, p.x, p.y, g.u - 6, g.u - 6); });
  },
  block(st) { const g = this.geo(), e = el('div', 'item', Stage.el); Object.assign(e.style, { position: 'absolute', borderRadius: '10px', background: this.blockColor, boxShadow: 'inset 0 -6px 0 rgba(43,33,24,.18), 0 0 0 4px #2B2118', zIndex: 6 }); st.els.push(e); place(e, 0, 0, g.u - 6, g.u - 6); return e; },
  async present(st) {
    st.blocks = [];
    st.obj = el('div', '', Stage.el); st.obj.style.position = 'absolute'; st.obj.style.zIndex = 4; st.els.push(st.obj);
    st.boxEl = K.item(Stage.el, 'assets/props/crate.png', 150, 140); st.boxEl.style.zIndex = 5; st.els.push(st.boxEl);
    st.row = el('div', '', Stage.el); st.row.style.position = 'absolute'; st.row.style.zIndex = 7; st.els.push(st.row);
    K.reg(st, 'box', st.boxEl, {}); K.reg(st, 'row', st.row, {});
    st.doneBtn = K.done(st, 'check'); K.reg(st, 'done', st.doneBtn, {});
    this.place(st);
    K.pop(st, st.obj);
    K.task(st, [[W2P.icon('ruler')], ['q']]);
    K.say(st, '摆到头，几块？');
  },
  add(st) {
    if (st.blocks.length >= st.q.len + 3) { K.wiggle(st, st.boxEl); return false; }
    const e = this.block(st), b = box(st.boxEl); place(e, b.x + 40, b.y + 30, this.geo().u - 6, this.geo().u - 6);
    const p = this.blockXY(st.blocks.length); st.blocks.push(e); K.flyTo(st, e, p.x, p.y, 320, 50); Sfx.place();
    if (st.level <= 2) Count.say(st.blocks.length); else Sfx.count(st.blocks.length);
    st.doneBtn.classList.add('ready');
    return 'ok';
  },
  remove(st) { if (!st.blocks.length) return false; const e = st.blocks.pop(); e.remove(); Sfx.back(); return 'ok'; },
  onGesture(st, name, p) {
    const id = p.id || '';
    if (id === 'box' && name === 'tap') return this.add(st);
    if (id === 'row' && name === 'tap') return this.remove(st);
    if (id === 'done' && name === 'tap') { Session.submit(st, st.blocks.length); return 'ok'; }
    return false;
  },
  async reveal(st) {
    const my = st, q = st.q;
    for (let k = 0; k < st.blocks.length; k++) { if (!Session.alive(my)) return; K.hop(st, st.blocks[k], 12); await Count.beat(st.scope, 300, k + 1); }
    K.badge(st, st.blocks[st.blocks.length - 1], q.len, 0, -20, 50);
    st.summary = CNQ(q.len) + '块长！';
    Sfx.reveal(); this.cheerAll(st);
    Voice.say(st.summary, { tag: 'summary' });
    await st.scope.wait(900);
  },
  async feedback(st, ans) {
    const q = st.q;
    Voice.say(ans > q.len ? '摆多啦，超出来了' : '还没摆到头', { tag: 'wrong' });
    if (ans > q.len) K.flash(st, st.blocks.slice(q.len));
    else { const g = this.geo(), gap = el('div', 'note', Stage.el); Object.assign(gap.style, { position: 'absolute', border: '5px dashed #FF6B5B', borderRadius: '10px' }); place(gap, g.x0 + ans * g.u, g.by, (q.len - ans) * g.u, g.u - 6); st.els.push(gap); K.flash(st, [gap]); }
    await st.scope.wait(800);
  },
  async correct(st) {
    const q = st.q, my = st;
    Voice.say('从头摆到尾！', { tag: 'fix' });
    while (st.blocks.length > q.len) { if (!Session.alive(my)) return; this.remove(st); await st.scope.wait(260); }
    while (st.blocks.length < q.len) { if (!Session.alive(my)) return; this.add(st); await st.scope.wait(360); }
    for (let k = 0; k < st.blocks.length; k++) { if (!Session.alive(my)) return; K.hop(st, st.blocks[k], 12); await Count.beat(st.scope, 330, k + 1); }
  },
  next(st, strat) {
    const want = strat === 'wrong' ? st.q.len + 1 : st.q.len, n = st.blocks.length;
    if (n < want) return { g: 'tap', p: { id: 'box' } };
    if (n > want) return { g: 'tap', p: { id: 'row' } };
    return { g: 'tap', p: { id: 'done' } };
  },
  workEls(st) { return [st.boxEl]; },
  gestureHint(st) { const c = center(st.boxEl); Hand.busy++; Hand.tap(st.scope, c.x, c.y).then(() => { Hand.done(); Hand.hide(st.scope); }); },
  snap(st) { return { blocks: st.blocks ? st.blocks.length : 0 }; },
};


/* ================================================================ WORLD 2 · new rules (client: no two games with the same
   logic - each island plays its own; the fourth game of every island is a reasoning test like a gifted-school entrance
   test). The answer is never shown: a wrong answer is named, the same question comes again (Session.round). */
const W2X = {
  ink: '#2B2118',
  pal: ['#FF6B5B', '#4FB3FF', '#5CC46E', '#FFC93C', '#B57BFF', '#FF9F43', '#3DD6C6'],
  cname: ['红色', '蓝色', '绿色', '黄色', '紫色', '橙色', '青色'],
  /* an svg that fills its box */
  node(w, h) { const s = svg('svg', { viewBox: '0 0 ' + w + ' ' + h, width: '100%', height: '100%' }); s.style.overflow = 'visible'; return s; },
  /* a positioned piece of the question (removed with it) */
  thing(st, w, h, z, cls) { const d = el('div', cls || 'item', Stage.el); d.style.position = 'absolute'; d.style.zIndex = z || 5; place(d, 0, 0, w, h); st.els.push(d); return d; },
  /* answer cards that hold drawings (or pictures); vals are the answers they stand for */
  cards(st, nodes, vals, opt) {
    const size = opt.size || 136, gap = opt.gap || 30, n = nodes.length, total = n * size + (n - 1) * gap;
    st.cards = nodes.map((nd, i) => {
      const c = el('div', 'card', Stage.el); c.style.position = 'absolute';
      const h = el('div', '', c); Object.assign(h.style, { width: '84%', height: '84%', display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none' });
      h.appendChild(nd);
      place(c, Math.round(opt.cx - total / 2 + i * (size + gap)), Math.round(opt.cy - size / 2), size, size);
      K.reg(st, 'card' + i, c, {}); st.els.push(c);
      st.scope.anim(c, [{ transform: 'scale(0) rotate(-8deg)' }, { transform: 'scale(1)' }], { duration: 320, delay: 60 * i, easing: EASE.pop, fill: 'backwards' });
      return c;
    });
    st.opts = vals.slice();
  },
  charImg(id) { const i = img('assets/chars/' + id + '.png', ''); Object.assign(i.style, { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', pointerEvents: 'none' }); return i; },
  propImg(k) { const i = img(W2P.src(k), ''); Object.assign(i.style, { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', pointerEvents: 'none' }); return i; },
  icon(str) { return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + str + '</svg>'); },
  /* polygon points of a regular n-gon / star around (cx, cy) */
  ngon(n, cx, cy, r, rot) { const a0 = ((rot || 0) - 90) * Math.PI / 180; return Array.from({ length: n }, (_, i) => { const a = a0 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }); },
  star(cx, cy, r, rot) { const a0 = ((rot || 0) - 90) * Math.PI / 180; return Array.from({ length: 10 }, (_, i) => { const a = a0 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)]; }); },
  pts(p) { return p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' '); },
  /* one figure: kind circle / tri / sq / pent / hex / star / diamond / arrow / heart / rect */
  shape(s, kind, cx, cy, r, fill, rot, sw) {
    const ink = this.ink, a = { fill: fill || '#fff', stroke: ink, 'stroke-width': sw || 4, 'stroke-linejoin': 'round' };
    rot = rot || 0;
    if (kind === 'circle') return svg('circle', Object.assign({ cx, cy, r }, a), s);
    if (kind === 'heart') { const g = svg('g', { transform: 'rotate(' + rot + ' ' + cx + ' ' + cy + ')' }, s); svg('path', Object.assign({ d: 'M' + cx + ' ' + (cy + r * 0.85) + 'C' + (cx - r * 1.3) + ' ' + (cy - r * 0.1) + ' ' + (cx - r * 0.7) + ' ' + (cy - r * 1.05) + ' ' + cx + ' ' + (cy - r * 0.45) + 'C' + (cx + r * 0.7) + ' ' + (cy - r * 1.05) + ' ' + (cx + r * 1.3) + ' ' + (cy - r * 0.1) + ' ' + cx + ' ' + (cy + r * 0.85) + 'Z' }, a), g); return g; }
    let p;
    if (kind === 'tri') p = this.ngon(3, cx, cy + r * 0.15, r * 1.1, rot);
    else if (kind === 'sq') p = this.ngon(4, cx, cy, r * 1.18, 45 + rot);
    else if (kind === 'diamond') p = this.ngon(4, cx, cy, r * 1.1, rot);
    else if (kind === 'pent') p = this.ngon(5, cx, cy, r * 1.05, rot);
    else if (kind === 'hex') p = this.ngon(6, cx, cy, r * 1.05, rot);
    else if (kind === 'star') p = this.star(cx, cy, r * 1.15, rot);
    else if (kind === 'rect') { const w = r * 1.5, h = r * 0.9, c = Math.cos(rot * Math.PI / 180), sn = Math.sin(rot * Math.PI / 180); p = [[-w, -h], [w, -h], [w, h], [-w, h]].map(([x, y]) => [cx + x * c - y * sn, cy + x * sn + y * c]); }
    else if (kind === 'arrow') { const c = Math.cos(rot * Math.PI / 180), sn = Math.sin(rot * Math.PI / 180); p = [[0, -1], [0.75, -0.1], [0.3, -0.1], [0.3, 0.95], [-0.3, 0.95], [-0.3, -0.1], [-0.75, -0.1]].map(([x, y]) => [cx + r * (x * c - y * sn), cy + r * (x * sn + y * c)]); }
    else p = this.ngon(4, cx, cy, r, 45);
    return svg('polygon', Object.assign({ points: this.pts(p) }, a), s);
  },
  /* the two watchers stand left of the check button (a game with a check button) */
  decorDone(G, chars) {
    const L = K.L();
    chars.forEach((id, i) => { const a = G.actors[id]; if (i === 0) showActor(a, L ? 86 : 72, L ? 698 : 1016, L ? 190 : 150); else if (i === 1) showActor(a, L ? 790 : 470, L ? 698 : 1016, L ? 170 : 140); else hideActor(a); });
  },
  hideAll(G, chars) { chars.forEach(id => hideActor(G.actors[id])); },
  say(text) { return Voice.say(text, { tag: 'wrong' }); },
  num(n) { return CN[n] != null ? CN[n] : String(n); },
  numQ(n) { return n === 2 ? '两' : this.num(n); },
};

/* ================================================================ 佩奇 Q2 · 藏 where: on / under / in / next to / left / right / between */
const PLACE_WORD = { on: '上面', under: '下面', in: '里面', beside: '旁边', left: '左边', right: '右边', mid: '中间' };
const PLACE_SAY = { on: '放到桌子上面！', under: '放到桌子下面！', in: '放进盒子里面！', beside: '放到桌子旁边！', left: '放到桌子左边！', right: '放到桌子右边！', mid: '放到两个中间！' };
const MPlace = {
  kind0: 'place', verb: '藏！', intro: '帮乔治藏恐龙！', praise: ['放得对对的！'],
  gen(G, o) {
    const d = Math.min(5, o.level);
    const sets = [null, ['on', 'under'], ['on', 'under', 'in'], ['on', 'under', 'in', 'beside'], ['on', 'under', 'left', 'right'], ['on', 'under', 'in', 'mid', 'left']];
    const spots = sets[d], answer = bagPick(G, 'pl' + d, spots);
    return { k: [answer, d], spots, answer, box: spots.includes('in') || spots.includes('mid') };
  },
  geo(st) {
    const L = K.L(), mid = st.q.spots.includes('mid');
    return L ? { floor: 560, t: { x: 330, w: 280, top: 360 }, b: { x: mid ? 770 : 700, y: 432, w: 150, h: 128 }, dino: { x: 150, y: 600 } }
      : { floor: 770, t: { x: 160, w: 250, top: 570 }, b: { x: mid ? 530 : 480, y: 642, w: 140, h: 128 }, dino: { x: 120, y: 880 } };
  },
  spotXY(st, k) {
    const g = this.geo(st), t = g.t, b = g.b, tc = t.x + t.w / 2;
    return { on: { x: tc, y: t.top - 54 }, under: { x: tc, y: (t.top + g.floor) / 2 + 18 }, in: { x: b.x + b.w / 2, y: b.y + 18 },
      beside: { x: t.x - 92, y: g.floor - 58 }, left: { x: t.x - 92, y: g.floor - 58 }, right: { x: t.x + t.w + 92, y: g.floor - 58 },
      mid: { x: (t.x + t.w + b.x) / 2, y: g.floor - 58 } }[k];
  },
  decor(G) { const L = K.L(); this.chars.forEach((id, i) => { const a = G.actors[id]; if (i === 0) showActor(a, L ? 70 : 60, L ? 698 : 1016, L ? 170 : 140); else if (i === 1 && !L) showActor(a, 640, 1016, 140); else hideActor(a); }); },
  place(st) {
    const g = this.geo(st), t = g.t, h = g.floor - t.top;
    const s = W2X.node(t.w, h); st.table.innerHTML = ''; st.table.appendChild(s);
    svg('rect', { x: 14, y: 20, width: 24, height: h - 22, rx: 6, fill: '#A86F38', stroke: W2X.ink, 'stroke-width': 4 }, s);
    svg('rect', { x: t.w - 38, y: 20, width: 24, height: h - 22, rx: 6, fill: '#A86F38', stroke: W2X.ink, 'stroke-width': 4 }, s);
    svg('rect', { x: 2, y: 2, width: t.w - 4, height: 30, rx: 12, fill: '#D99A55', stroke: W2X.ink, 'stroke-width': 5 }, s);
    place(st.table, t.x, t.top, t.w, h);
    if (st.boxEl) place(st.boxEl, g.b.x, g.b.y, g.b.w, g.b.h);
    st.spots.forEach(o => { const p = this.spotXY(st, o.k); place(o.e, p.x - 52, p.y - 52, 104, 104); });
    const at = st.at ? this.spotXY(st, st.at) : g.dino; place(st.dino, at.x - 42, at.y - 42, 84, 84);
  },
  async present(st) {

    st.spots = q.spots.map(k => { const e = W2X.thing(st, 104, 104, 6, ''); Object.assign(e.style, { borderRadius: '50%', border: '5px dashed rgba(43,33,24,.55)', background: 'rgba(255,255,255,.35)' }); K.reg(st, 'sp_' + k, e, {}); return { k, e }; });
    st.dino = K.item(Stage.el, 'assets/props/dino.png', 84, 84); st.dino.style.zIndex = 8; st.els.push(st.dino);
    this.place(st);
    st.spots.forEach((o, i) => K.pop(st, o.e, 80 * i));
    const parts = [['assets/props/dino.png'], [{ node: (() => { const s = svg('svg', { viewBox: '0 0 90 60', width: 90, height: 60 }); svg('rect', { x: 8, y: 14, width: 74, height: 10, rx: 4, fill: '#D99A55', stroke: W2X.ink, 'stroke-width': 3 }, s); svg('rect', { x: 14, y: 22, width: 8, height: 32, fill: '#A86F38', stroke: W2X.ink, 'stroke-width': 3 }, s); svg('rect', { x: 68, y: 22, width: 8, height: 32, fill: '#A86F38', stroke: W2X.ink, 'stroke-width': 3 }, s); if (visualMode()) { const p = { on: [45, 6], under: [45, 40], in: [45, 40], beside: [4, 46], left: [4, 46], right: [86, 46], mid: [86, 46] }[q.answer]; svg('circle', { cx: p[0], cy: p[1], r: 6, fill: '#FF6B5B', stroke: W2X.ink, 'stroke-width': 2 }, s); } const d = el('span'); d.appendChild(s); return d; })() }]];

  next(st, strat) { if (st.at) return null; const k = strat === 'wrong' ? st.q.spots.find(x => x !== st.q.answer) : st.q.answer; return { g: 'tap', p: { id: 'sp_' + k } }; },

/* ================================================================ 佩奇 Q3 · 跳 puddles from the smallest to the biggest (seriation) */
const MSeriate = {
  kind0: 'seriate', verb: '跳！', intro: '从小跳到大！', praise: ['跳得真有顺序！'],
  gen(G, o) {

    const n = d === 1 ? 3 : d <= 3 ? 4 : 5;

/* ================================================================ 汪汪队 D1 · 开车 drive to the kitten - only enough fuel for the shortest way */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const MCode = {
  kind0: 'code', verb: '开！', intro: '开到小猫那里！', praise: ['一步都不多！'],
  gen(G, o) {
    const d = Math.min(5, o.level), rng = o.rng, C = 6, R = 4;
    const nObs = d <= 3 ? 0 : d === 4 ? 2 : 4;
    for (let t = 0; t < 400; t++) {
      const s = [rng.int(0, C - 1), rng.int(0, R - 1)];
      let g;
      if (d === 1) { g = [s[0] + rng.pick([-2, 2]), s[1]]; }
      else if (d === 2) { g = rng() < 0.5 ? [s[0] + rng.pick([-3, -2, 2, 3]), s[1]] : [s[0] + rng.pick([-2, 2]), s[1] + rng.pick([-1, 1])]; }
      else g = [rng.int(0, C - 1), rng.int(0, R - 1)];
      if (g[0] < 0 || g[0] >= C || g[1] < 0 || g[1] >= R || (g[0] === s[0] && g[1] === s[1])) continue;
      const man = Math.abs(g[0] - s[0]) + Math.abs(g[1] - s[1]);
      if (d >= 3 && (man < 3 || man > 6 || g[0] === s[0] || g[1] === s[1])) continue;
      const obs = [];
      for (let k = 0; k < nObs * 10 && obs.length < nObs; k++) { const c = [rng.int(0, C - 1), rng.int(0, R - 1)]; if ((c[0] === s[0] && c[1] === s[1]) || (c[0] === g[0] && c[1] === g[1]) || obs.some(x => x[0] === c[0] && x[1] === c[1])) continue; obs.push(c); }
      const fuel = this.bfs(C, R, obs, s, g);
      if (fuel == null) continue;
      if (d >= 4 && fuel === man) continue;                 /* the cones make the way longer than it looks */
      return { k: [s.join(), g.join(), obs.join('|')], C, R, s, g, obs, fuel, answer: 'goal' };
    }
    return { k: ['x'], C, R, s: [0, 0], g: [2, 0], obs: [], fuel: 2, answer: 'goal' };
  },
  bfs(C, R, obs, s, g, retPath) {
    const key = c => c[0] + ',' + c[1], seen = { [key(s)]: null }, q = [s];
    const blocked = c => c[0] < 0 || c[0] >= C || c[1] < 0 || c[1] >= R || obs.some(o => o[0] === c[0] && o[1] === c[1]);
    while (q.length) {
      const c = q.shift();
      if (c[0] === g[0] && c[1] === g[1]) { const path = []; let k = key(c); while (seen[k]) { path.unshift(seen[k].d); k = seen[k].from; } return retPath ? path : path.length; }
      for (const d in DIRS) { const n = [c[0] + DIRS[d][0], c[1] + DIRS[d][1]]; if (blocked(n) || key(n) in seen) continue; seen[key(n)] = { from: key(c), d }; q.push(n); }
    }
    return null;
  },
  geo() { const L = K.L(); return L ? { x0: 120, y0: 120, cell: 88, pad: { cx: 862, cy: 380, s: 92 }, fuel: { x: 160, y: 490, per: 12 } } : { x0: 46, y0: 250, cell: 102, pad: { cx: 540, cy: 850, s: 96 }, fuel: { x: 40, y: 790, per: 5 } }; },
  cellXY(c) { const g = this.geo(); return { x: g.x0 + c[0] * g.cell + g.cell / 2, y: g.y0 + c[1] * g.cell + g.cell / 2 }; },
  decor(G) { const L = K.L(); this.chars.forEach((id, i) => { const a = G.actors[id]; if (i === 0 && L) showActor(a, 862, 260, 150); else hideActor(a); }); },
  place(st) {

    st.tiles.forEach(t => { const p = this.cellXY(t.c); place(t.e, p.x - g.cell / 2 + 3, p.y - g.cell / 2 + 3, g.cell - 6, g.cell - 6); });

    const k = this.cellXY(q.g); place(st.cat, k.x - 34, k.y - 36, 68, 68);
    st.btns.forEach(b => { const v = DIRS[b.d]; place(b.e, g.pad.cx + v[0] * g.pad.s - g.pad.s / 2 + 4, g.pad.cy + v[1] * g.pad.s - g.pad.s / 2 + 4, g.pad.s - 8, g.pad.s - 8); });
    st.cans.forEach((e, i) => place(e, g.fuel.x + (i % g.fuel.per) * 46, g.fuel.y + Math.floor(i / g.fuel.per) * 54, 38, 46));

  async present(st) {

    st.at = q.s.slice(); st.used = 0;

}
